<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GuitarFret">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <title>GuitarFret · 和弦识别</title>
  <style>
    :root {
      --ink: #16181D;
      --ink-soft: #3A3D44;
      --muted: #8A8578;
      --line: #E6E1D6;
      --line-soft: #EFEBE2;
      --paper: #FBFAF8;
      --card: #FFFFFF;
      --root: #C7522A;
      --third: #0E7C66;
      --fifth: #3E5C8A;
      --seventh: #B8801F;
      --other: #8A8578;
      --accent: #0E9C84;
      --accent-soft: #E3F4EF;
      --board: #F6F1E7;
      --board-edge: #DED6C6;
      --wire: #C9C0AE;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body { background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.5; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

    .wrap { max-width: 1180px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); }
    .brand { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .brand b { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
    .brand span { font-size: 12px; color: var(--muted); }

    /* ---- shared fretboard ---- */
    .board { position: relative; background: var(--board); border: 1px solid var(--board-edge); border-radius: 14px; overflow: hidden; }
    .board .lbl { display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #4b3c32; cursor: pointer; position: relative; z-index: 3; background: transparent; }
    .board .lbl.mute { color: #8e3328; }
    .board .lbl.open { color: var(--accent); }
    .board .cell { position: relative; cursor: pointer; }
    .board.h .cell { border-right: 2px solid rgba(82, 59, 41, .4); }
    .board.v .cell { border-bottom: 2px solid rgba(82, 59, 41, .4); }
    .nutbar { background: #ece1cd; z-index: 1; }
    .board.h .nutbar { border-right: 4px solid #6b5743; }
    .board.v .nutbar { border-bottom: 4px solid #6b5743; }
    .board .wire { z-index: 2; background: linear-gradient(var(--wiredir, 180deg), rgba(255,255,255,.7), rgba(150,150,148,.7) 45%, rgba(110,112,110,.6) 58%, rgba(255,255,255,.4)); pointer-events: none; }
    .board .wire.wound { background: linear-gradient(var(--wiredir,180deg), #e9dec6, #c3b591 46%, #9a8c6c 58%, #e3d8bd); }
    .board .fnum { font-size: 11px; font-weight: 700; color: var(--muted); pointer-events: none; }
    .board .inlay { width: 8px; height: 8px; border-radius: 50%; background: rgba(92,79,56,.22); pointer-events: none; z-index: 1; }
    .dot { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; border: 2px solid rgba(255,255,255,.8); box-shadow: 0 2px 5px rgba(40,30,18,.18); z-index: 3; pointer-events: none; }
    .dot.root { background: var(--root); } .dot.third { background: var(--third); } .dot.fifth { background: var(--fifth); } .dot.seventh { background: var(--seventh); } .dot.other { background: var(--other); }
    .mutemark { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #8e3328; font-weight: 800; z-index: 3; pointer-events: none; }

    /* ---- chord diagram ---- */
    .diagram svg { display: block; }

    /* ---- on-board interval ladder ---- */
    .iv-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .iv-pill { position: absolute; transform: translate(-50%, -50%); background: #fff; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--ink-soft); padding: 1px 7px; z-index: 5; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.1); pointer-events: none; }

    /* ---- COACH (phone) ---- */
    #coach { display: none; }
    #coach .board-wrap { margin-bottom: 14px; }
    #coach .result { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
    #coach .result .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
    #coach .result .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    #coach .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    #coach .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .ivline { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 1.6; }
    .ivline i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .voice-rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .voice-rail::-webkit-scrollbar { display: none; }
    .voice-card { flex: 0 0 auto; width: 92px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; background: var(--card); }
    .voice-card .vn { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .coach-bubble { background: var(--accent-soft); border-radius: 16px; border-top-left-radius: 4px; padding: 14px 16px; font-size: 15px; line-height: 1.6; color: #0c4a3f; }

    /* ---- BENCH (ipad/wide) ---- */
    #bench { display: none; }
    #bench .zlabel { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    #bench .info-zone { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 14px; margin-top: 14px; align-items: stretch; }
    #bench .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    #bench .panel h3 { margin: 0 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
    #bench .chordname { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
    #bench .chordsub { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
    #bench .readout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #bench .ro { background: var(--paper); border-radius: 10px; padding: 8px 10px; }
    #bench .ro .k { font-size: 11px; color: var(--muted); }
    #bench .ro .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
    #bench .shelf { display: grid; gap: 7px; }
    #bench .shelf-item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; cursor: pointer; background: var(--card); }
    #bench .shelf-item.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    #bench .shelf-item .si-name { font-size: 12.5px; font-weight: 600; }
    #bench .shelf-item .si-shape { font-size: 11.5px; color: var(--muted); }
    .wheel-wrap { display: grid; place-items: center; padding: 8px 0 0; }
    .why { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 12px 0 0; }

    @media (max-width: 819px) { #coach { display: block; } }
    @media (min-width: 820px) { #bench { display: block; } }

    /* ---- 进阶视角 ---- */
    .adv-toggle { width: 100%; margin-top: 16px; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; font-weight: 600; color: var(--ink-soft); }
    .adv-toggle .chev { color: var(--muted); transition: transform .2s; }
    .adv-toggle.open .chev { transform: rotate(180deg); }
    .adv-fold[hidden] { display: none; }
    .adv-fold { margin-top: 12px; display: grid; gap: 12px; }
    @media (min-width: 820px) { .adv-fold:not([hidden]) { grid-template-columns: 1fr 1fr 1fr; } }
    .adv-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .adv-panel h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    .adv-note { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 10px 0 0; }
    .caged-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .caged-card { border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer; }
    .caged-card.active { border-color: var(--cl, var(--ink)); box-shadow: inset 0 0 0 1px var(--cl, var(--ink)); }
    .caged-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .caged-letter { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: #F3EFE7; }
    .caged-card.active .caged-letter { background: var(--cl); color: #fff; }
    .caged-range { font-size: 10px; color: var(--muted); font-weight: 700; }
    .caged-mini { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 7px); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #f0e4cf; }
    .caged-mini-cell { border-right: 1px solid rgba(82,59,41,.2); border-bottom: 1px solid rgba(82,59,41,.14); }
    .caged-root-dot { align-self: center; justify-self: center; width: 11px; height: 11px; border-radius: 50%; background: var(--root); color: #fff; font-size: 7px; display: grid; place-items: center; z-index: 2; border: 1px solid #fff; }
    .anchor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .anchor-btn { border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; }
    .anchor-btn.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .nearby { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
    .nearby-tone { border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
    .nearby-tone b { font-size: 13px; } .nearby-tone span { color: var(--muted); display: block; font-size: 11px; }
    .prompt { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.5; min-height: 56px; }
    .quiz-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .quiz-actions button { border: 1px solid var(--line); border-radius: 10px; padding: 9px; font-weight: 600; background: var(--card); }
    .feedback { margin-top: 8px; font-size: 13px; color: var(--ink-soft); font-weight: 600; min-height: 18px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><b>GuitarFret</b><span id="modeTag"></span></div>

    <!-- ============ COACH (iPhone) ============ -->
    <section id="coach">
      <div class="board-wrap" id="coachBoard"></div>
      <div class="result">
        <div class="diagram" id="coachDiagram"></div>
        <div>
          <div class="big" id="coachName">—</div>
          <div class="sub" id="coachSub">点指板按出你的和弦</div>
        </div>
      </div>
      <div class="card">
        <h3>音程 · 大白话</h3>
        <div id="coachIntervals"></div>
      </div>
      <div class="card">
        <h3>其他按法</h3>
        <div class="voice-rail" id="coachVoicings"></div>
      </div>
      <div class="coach-bubble" id="coachWhy"></div>
    </section>

    <!-- ============ BENCH (iPad) ============ -->
    <section id="bench">
      <div class="board-zone">
        <div class="zlabel">指板 · 点品发音 + 静音弦（点弦名切 ○ 空弦 / ✕ 闷音）</div>
        <div id="benchBoard"></div>
      </div>
      <div class="info-zone">
        <div class="panel">
          <div class="chordname" id="benchName">—</div>
          <div class="chordsub" id="benchSub">点指板按出你的和弦</div>
          <div class="wheel-wrap" id="benchWheel"></div>
        </div>
        <div class="panel">
          <h3>读数 · 为什么这么按</h3>
          <div class="readout" id="benchReadout"></div>
          <p class="why" id="benchWhy"></p>
        </div>
        <div class="panel">
          <h3>不同把位 · 货架</h3>
          <div class="shelf" id="benchShelf"></div>
        </div>
      </div>
    </section>

    <button class="adv-toggle" id="advToggle" type="button" aria-expanded="false">进阶视角 · CAGED / 根音 / 练习 <span class="chev">▾</span></button>
    <div class="adv-fold" id="advFold" hidden>
      <section class="adv-panel">
        <h3>CAGED 视角 · <span id="cagedRoot">—</span></h3>
        <div class="caged-grid" id="cagedGrid"></div>
        <p class="adv-note" id="cagedNote"></p>
      </section>
      <section class="adv-panel">
        <h3>从一个根音长出和弦</h3>
        <div class="anchor-grid" id="anchorGrid"></div>
        <p class="adv-note" id="anchorSummary"></p>
        <div class="nearby" id="nearbyTones"></div>
      </section>
      <section class="adv-panel">
        <h3>小练习</h3>
        <div class="prompt" id="quizPrompt"></div>
        <div class="quiz-actions">
          <button id="quizReveal" type="button">显示答案</button>
          <button id="quizNext" type="button">换一题</button>
        </div>
        <div class="feedback" id="quizFeedback"></div>
      </section>
    </div>
  </main>

  <script>
    const strings = [
      { number: 1, note: "e", pitch: 4, midi: 64 },
      { number: 2, note: "B", pitch: 11, midi: 59 },
      { number: 3, note: "G", pitch: 7, midi: 55 },
      { number: 4, note: "D", pitch: 2, midi: 50 },
      { number: 5, note: "A", pitch: 9, midi: 45 },
      { number: 6, note: "E", pitch: 4, midi: 40 }
    ];
    const pitchClasses = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const noteToPitch = { C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11 };
    const noteLetters = ["C","D","E","F","G","A","B"];
    const FRETS = 12;
    const fretWidths = Array.from({ length: FRETS }, (_, i) => Math.pow(2, -i / 12) - Math.pow(2, -(i + 1) / 12));
    const PREF = {0:"C",1:"C#",2:"D",3:"Eb",4:"E",5:"F",6:"F#",7:"G",8:"Ab",9:"A",10:"Bb",11:"B"};
    const SEMI_NAME = {0:"同度",1:"小二度",2:"大二度",3:"小三度",4:"大三度",5:"纯四度",6:"三全音",7:"纯五度",8:"小六度",9:"大六度",10:"小七度",11:"大七度"};
    const IV_ABBR = {0:"八度",1:"小2",2:"大2",3:"小3",4:"大3",5:"纯4",6:"增4",7:"纯5",8:"小6",9:"大6",10:"小7",11:"大7"};
    function intervalAbbr(gap) { const n = IV_ABBR[((gap % 12) + 12) % 12]; return gap >= 12 && gap % 12 !== 0 ? n + "·8" : (gap >= 12 ? "八度" : n); }
    const roleText = {"1":"根音","b3":"小三度","3":"大三度","5":"五度","b5":"减五度","#5":"增五度","b7":"小七度","7":"大七度","9":"九度","2":"二度","4":"四度","6":"六度"};

    const TEMPLATES = [
      { label:"maj7", tones:[["1",0,1],["3",4,3],["5",7,5],["7",11,7]], essential:["1","3","7"] },
      { label:"m7",   tones:[["1",0,1],["b3",3,3],["5",7,5],["b7",10,7]], essential:["1","b3","b7"] },
      { label:"7",    tones:[["1",0,1],["3",4,3],["5",7,5],["b7",10,7]], essential:["1","3","b7"] },
      { label:"m7b5", tones:[["1",0,1],["b3",3,3],["b5",6,5],["b7",10,7]], essential:["1","b3","b5","b7"] },
      { label:"m",    tones:[["1",0,1],["b3",3,3],["5",7,5]], essential:["1","b3"] },
      { label:"",     tones:[["1",0,1],["3",4,3],["5",7,5]], essential:["1","3"] },
      { label:"dim",  tones:[["1",0,1],["b3",3,3],["b5",6,5]], essential:["1","b3","b5"] },
      { label:"aug",  tones:[["1",0,1],["3",4,3],["#5",8,5]], essential:["1","3","#5"] },
      { label:"sus4", tones:[["1",0,1],["4",5,4],["5",7,5]], essential:["1","4","5"] },
      { label:"sus2", tones:[["1",0,1],["2",2,2],["5",7,5]], essential:["1","2","5"] }
    ];

    const state = { frets: [null, null, null, null, null, null] };

    function pitchName(p) { return PREF[((p % 12) + 12) % 12]; }
    function getNoteLetter(root, degree) { return noteLetters[(noteLetters.indexOf(root[0]) + degree - 1) % 7]; }
    function spellInterval(root, semitones, degree) {
      const target = (noteToPitch[root] + semitones) % 12;
      const letter = getNoteLetter(root, degree);
      let diff = (target - noteToPitch[letter] + 12) % 12;
      if (diff > 6) diff -= 12;
      if (diff === 0) return letter;
      if (diff === 1) return letter + "#";
      if (diff === -1) return letter + "b";
      return pitchClasses[target];
    }
    function roleClass(role) {
      if (role === "1") return "root";
      if (role === "3" || role === "b3") return "third";
      if (role === "5" || role === "b5" || role === "#5") return "fifth";
      if (role === "7" || role === "b7") return "seventh";
      return "other";
    }

    function pressedNotes() {
      const out = [];
      state.frets.forEach((fret, idx) => {
        if (fret === null) return;
        const s = strings.find(st => st.number === 6 - idx);
        out.push({ stringNumber: s.number, fret, pitch: (s.pitch + fret) % 12, midi: s.midi });
      });
      return out;
    }

    function recognize() {
      const notes = pressedNotes();
      const set = new Set(notes.map(n => n.pitch));
      if (set.size < 2) return null;
      let best = null;
      for (const rp of set) {
        for (const t of TEMPLATES) {
          const tonePitches = t.tones.map(([, s]) => (rp + s) % 12);
          const present = t.tones.filter(([, s]) => set.has((rp + s) % 12));
          if (!present.some(([r]) => r === "1")) continue;
          const essMissing = t.essential.filter(r => {
            const tone = t.tones.find(x => x[0] === r);
            return !set.has((rp + tone[1]) % 12);
          });
          if (essMissing.length > 1) continue;
          const extra = [...set].filter(p => !tonePitches.includes(p)).length;
          const missing = t.tones.length - present.length;
          const score = present.length * 3 - missing - essMissing.length * 4 - extra * 2;
          if (!best || score > best.score) {
            best = {
              rootPitch: rp, root: pitchName(rp), template: t,
              symbol: pitchName(rp) + t.label, score,
              present: present.map(x => x[0]), missingRoles: t.tones.filter(([, s]) => !set.has((rp + s) % 12)).map(x => x[0]), extra
            };
          }
        }
      }
      return best;
    }

    function formulaOf(match) {
      return match.template.tones.map(([role, semi, deg]) => [spellInterval(match.root, semi, deg), role]);
    }

    function allRootPositions(root) {
      const target = noteToPitch[root];
      const out = [];
      strings.forEach(s => {
        for (let f = 0; f <= FRETS; f++) if ((s.pitch + f) % 12 === target) out.push({ stringNumber: s.number, fret: f });
      });
      return out;
    }

    function generateVoicing(anchor, root, formula) {
      const frets = [null, null, null, null, null, null];
      const roles = [null, null, null, null, null, null];
      const pitches = new Set(formula.map(([n]) => noteToPitch[n]));
      const roleByPitch = {};
      formula.forEach(([n, r]) => { roleByPitch[noteToPitch[n]] = r; });
      strings.forEach(s => {
        const idx = 6 - s.number;
        if (s.number === anchor.stringNumber) { frets[idx] = anchor.fret; roles[idx] = "1"; return; }
        let pick = null;
        for (let f = 0; f <= FRETS; f++) {
          const p = (s.pitch + f) % 12;
          if (!pitches.has(p)) continue;
          const near = Math.abs(f - anchor.fret) <= 3 || (anchor.fret <= 3 && f === 0);
          if (!near) continue;
          const dist = Math.abs(f - anchor.fret);
          if (!pick || dist < pick.dist) pick = { fret: f, role: roleByPitch[p], dist };
        }
        if (pick) { frets[idx] = pick.fret; roles[idx] = pick.role; }
      });
      return { frets, roles, anchor };
    }

    function chordVoicings(root, formula) {
      const positions = allRootPositions(root).filter(p => p.stringNumber >= 4 || p.fret <= 7).slice(0, 6);
      const seen = new Set();
      const out = [];
      positions.forEach(a => {
        const v = generateVoicing(a, root, formula);
        const key = v.frets.join(",");
        if (seen.has(key)) return;
        seen.add(key);
        out.push(v);
      });
      return out;
    }

    function shapeString(frets) {
      return frets.map(f => f === null ? "x" : f).join("-");
    }

    /* ---------- audio ---------- */
    let ac;
    function pluck(midi, fret) {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const now = ac.currentTime;
      const freq = 440 * Math.pow(2, (midi + fret - 69) / 12);
      const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = "triangle"; o.frequency.setValueAtTime(freq, now);
      fl.type = "lowpass"; fl.frequency.setValueAtTime(2000, now); fl.frequency.exponentialRampToValueAtTime(600, now + 0.22);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.2, now + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      o.connect(fl); fl.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + 0.75);
    }

    /* ---------- board render ---------- */
    function boardHTML(vertical) {
      const order = vertical ? [6, 5, 4, 3, 2, 1] : [1, 2, 3, 4, 5, 6];
      const slot = sn => order.indexOf(sn) + (vertical ? 2 : 1); // vertical: string columns 2..7; horizontal: string rows 1..6
      const cells = [];

      // nut bar
      cells.push(vertical
        ? `<div class="nutbar" style="grid-column:2 / 8;grid-row:1"></div>`
        : `<div class="nutbar" style="grid-row:1 / 7;grid-column:1"></div>`);

      // string labels (at the nut)
      order.forEach(sn => {
        const s = strings.find(x => x.number === sn);
        const f = state.frets[6 - sn];
        const cls = f === null ? "mute" : f === 0 ? "open" : "";
        const txt = f === null ? "✕" : f === 0 ? "○" : s.note;
        const pos = vertical ? `grid-column:${slot(sn)};grid-row:1` : `grid-row:${slot(sn)};grid-column:1`;
        cells.push(`<button class="lbl ${cls}" data-strlabel="${sn}" style="${pos}">${txt}</button>`);
      });

      // fret cells (border = fret wire)
      order.forEach(sn => {
        for (let f = 1; f <= FRETS; f++) {
          const pos = vertical ? `grid-column:${slot(sn)};grid-row:${f + 1}` : `grid-row:${slot(sn)};grid-column:${f + 1}`;
          cells.push(`<button class="cell" data-string="${sn}" data-fret="${f}" style="${pos}"></button>`);
        }
      });

      // strings
      order.forEach(sn => {
        const wound = sn >= 4 ? "wound" : "";
        const thick = ({ 6: 6, 5: 5, 4: 4.5, 3: 3, 2: 2.2, 1: 1.6 })[sn];
        const style = vertical
          ? `grid-column:${slot(sn)};grid-row:2 / ${FRETS + 2};width:${thick}px;justify-self:center;height:100%;--wiredir:90deg`
          : `grid-row:${slot(sn)};grid-column:2 / ${FRETS + 2};height:${thick}px;align-self:center;width:100%`;
        cells.push(`<span class="wire ${wound}" style="${style}"></span>`);
      });

      // fret numbers + inlays
      for (let f = 1; f <= FRETS; f++) {
        const np = vertical ? `grid-column:1;grid-row:${f + 1};place-self:center` : `grid-column:${f + 1};grid-row:7;justify-self:center`;
        cells.push(`<span class="fnum" style="${np}">${f}</span>`);
        if ([3, 5, 7, 9, 12].includes(f)) {
          const ip = vertical ? `grid-column:4 / 6;grid-row:${f + 1}` : `grid-row:3 / 5;grid-column:${f + 1}`;
          cells.push(`<span class="inlay" style="position:static;place-self:center;${ip}"></span>`);
        }
      }

      // markers
      const match = recognize();
      const roleByPitch = {};
      if (match) formulaOf(match).forEach(([n, r]) => { roleByPitch[noteToPitch[n]] = [n, r]; });
      const dotSize = vertical ? 36 : 32;
      order.forEach(sn => {
        const f = state.frets[6 - sn];
        if (f === null) return;
        const s = strings.find(x => x.number === sn);
        const p = (s.pitch + f) % 12;
        const tone = roleByPitch[p];
        const note = tone ? tone[0] : pitchName(p);
        const role = tone ? tone[1] : "";
        const pos = vertical
          ? `grid-column:${slot(sn)};grid-row:${f === 0 ? 1 : f + 1}`
          : `grid-row:${slot(sn)};grid-column:${f === 0 ? 1 : f + 1}`;
        cells.push(`<span class="mk" data-midi="${s.midi + f}" data-role="${role}" style="position:relative;pointer-events:none;${pos};z-index:4"><span class="dot ${roleClass(role)}" style="width:${dotSize}px;height:${dotSize}px;font-size:${vertical ? 16 : 14}px">${note}</span></span>`);
      });
      return cells.join("");
    }

    function renderBoard(el, vertical, height) {
      const fw = fretWidths.map(w => (w * 1000).toFixed(2) + "fr").join(" ");
      const cols = vertical ? `22px repeat(6, 1fr)` : `34px ${fw}`;
      const rows = vertical ? `26px ${fw}` : `repeat(6, 1fr) 16px`;
      el.innerHTML = `<div class="board ${vertical ? "v" : "h"}" style="display:grid;grid-template-columns:${cols};grid-template-rows:${rows};height:${height};padding:0 8px 8px">${boardHTML(vertical)}</div>`;
    }

    function renderIntervalOverlay(boardEl) {
      const board = boardEl.querySelector(".board");
      if (!board) return;
      const rect = board.getBoundingClientRect();
      if (rect.width < 10) return; // hidden layout
      const mks = [...board.querySelectorAll(".mk")].map(m => {
        const r = m.getBoundingClientRect();
        return { x: r.left + r.width / 2 - rect.left, y: r.top + r.height / 2 - rect.top, midi: +m.dataset.midi };
      }).sort((a, b) => a.midi - b.midi);
      if (mks.length < 2) return;
      let lines = "", labels = "";
      for (let i = 0; i < mks.length - 1; i++) {
        const a = mks[i], b = mks[i + 1];
        lines += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="#5b5e66" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>`;
        labels += `<div class="iv-pill" style="left:${((a.x + b.x) / 2).toFixed(1)}px;top:${((a.y + b.y) / 2).toFixed(1)}px">${intervalAbbr(b.midi - a.midi)}</div>`;
      }
      board.insertAdjacentHTML("beforeend", `<svg class="iv-lines" viewBox="0 0 ${rect.width.toFixed(1)} ${rect.height.toFixed(1)}" preserveAspectRatio="none">${lines}</svg>${labels}`);
    }

    /* ---------- chord diagram (standard box) ---------- */
    function diagramSVG(frets, size) {
      const W = size, cols = 6, pad = size * 0.12, top = size * 0.22;
      const innerW = W - pad * 2, colGap = innerW / (cols - 1);
      const fretted = frets.filter(f => f && f > 0);
      let start = 1, span = 4;
      if (fretted.length) {
        const mx = Math.max(...fretted);
        if (mx > 4) start = Math.min(...fretted); else start = 1;
      }
      const rowGap = size * 0.205, H = top + span * rowGap + size * 0.14;
      const dotR = size * 0.085, mk = size * 0.16;
      const x = c => pad + c * colGap, y = r => top + r * rowGap;
      let s = `<svg width="${W}" height="${H.toFixed(1)}" viewBox="0 0 ${W} ${H.toFixed(1)}">`;
      if (start === 1) s += `<rect x="${pad}" y="${(top - size * 0.04).toFixed(1)}" width="${innerW.toFixed(1)}" height="${(size * 0.04).toFixed(1)}" fill="#534338"/>`;
      else s += `<text x="${(pad - 3).toFixed(1)}" y="${(top + size * 0.13).toFixed(1)}" font-size="${mk * 0.62}" fill="#8A8578" text-anchor="end">${start}</text>`;
      for (let c = 0; c < cols; c++) s += `<line x1="${x(c).toFixed(1)}" y1="${top.toFixed(1)}" x2="${x(c).toFixed(1)}" y2="${y(span).toFixed(1)}" stroke="#C9C0AE" stroke-width="1"/>`;
      for (let r = 0; r <= span; r++) s += `<line x1="${pad.toFixed(1)}" y1="${y(r).toFixed(1)}" x2="${(pad + innerW).toFixed(1)}" y2="${y(r).toFixed(1)}" stroke="#D8CDB8" stroke-width="1"/>`;
      frets.forEach((f, i) => {
        const col = i; // 0..5 = string6..string1 = low E .. high e
        if (f === null) { s += `<text x="${x(col).toFixed(1)}" y="${(top - size * 0.07).toFixed(1)}" font-size="${mk}" fill="#8e3328" text-anchor="middle">✕</text>`; return; }
        if (f === 0) { s += `<circle cx="${x(col).toFixed(1)}" cy="${(top - size * 0.09).toFixed(1)}" r="${(dotR * 0.62).toFixed(1)}" fill="none" stroke="#0E9C84" stroke-width="1.3"/>`; return; }
        const rr = f - start + 1;
        if (rr < 1 || rr > span) return;
        s += `<circle cx="${x(col).toFixed(1)}" cy="${(y(rr) - rowGap / 2).toFixed(1)}" r="${dotR.toFixed(1)}" fill="#16181D"/>`;
      });
      s += `</svg>`;
      return s;
    }

    /* ---------- interval wheel ---------- */
    function wheelSVG(match) {
      const size = 186, c = size / 2, R = 56;
      const formula = formulaOf(match);
      let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
      s += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#E6E1D6" stroke-width="1"/>`;
      const colorVar = { root:"--root", third:"--third", fifth:"--fifth", seventh:"--seventh", other:"--other" };
      const rootPitch = match.rootPitch;
      formula.forEach(([note, role]) => {
        const semi = (noteToPitch[note] - rootPitch + 12) % 12;
        const ang = (semi / 12) * 2 * Math.PI - Math.PI / 2;
        const px = c + R * Math.cos(ang), py = c + R * Math.sin(ang);
        const col = getComputedStyle(document.documentElement).getPropertyValue(colorVar[roleClass(role)]).trim() || "#888";
        if (role !== "1") s += `<line x1="${c}" y1="${c}" x2="${px}" y2="${py}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
        s += `<circle cx="${px}" cy="${py}" r="13" fill="${col}"/>`;
        s += `<text x="${px}" y="${py + 4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${note}</text>`;
        const lx = c + (R + 16) * Math.cos(ang), ly = c + (R + 16) * Math.sin(ang);
        s += `<text x="${lx}" y="${ly + 3}" font-size="9" fill="#8A8578" text-anchor="middle">${role === "1" ? "根音" : roleText[role]}</text>`;
      });
      s += `<circle cx="${c}" cy="${c}" r="3" fill="#C7C2B6"/></svg>`;
      return s;
    }

    /* ---------- renderers ---------- */
    function plainIntervals(match) {
      const formula = formulaOf(match);
      const root = formula[0][0];
      return formula.slice(1).map(([note, role]) => {
        const semi = (noteToPitch[note] - noteToPitch[root] + 12) % 12;
        return `<div class="ivline"><i style="background:var(--${["--third","--fifth","--seventh","--other"].includes("--"+roleClass(role))?roleClass(role):"other"})"></i>
          <span><b>${note}</b> 比根音 ${root} 高 ${semi} 个半音 = <b>${SEMI_NAME[semi]}</b></span></div>`;
      }).join("");
    }

    function whyText(match) {
      const formula = formulaOf(match);
      const third = formula.find(([, r]) => r === "b3" || r === "3");
      const seventh = formula.find(([, r]) => r === "b7" || r === "7");
      if (seventh) return `${match.symbol} 的性格主要由 ${third[0]}（${roleText[third[1]]}）和 ${seventh[0]}（${roleText[seventh[1]]}）决定：三度定明暗，七度加张力。换和弦时盯住这两个音怎么动，最省力。`;
      return `${match.symbol} 先找根音 ${match.root}，再看三度是 ${third ? roleText[third[1]] : "三度"}——三度决定这个和弦是亮还是暗。`;
    }

    function loadVoicing(frets) {
      state.frets = frets.slice();
      render();
    }

    /* ---------- 进阶视角: CAGED / 根音 / 练习 ---------- */
    const fretCount = FRETS;
    function getStringInfo(n) { return strings.find(s => s.number === n); }
    function currentChord() { const m = recognize(); return m ? { root: m.root, symbol: m.symbol, formula: formulaOf(m) } : null; }

    function getAllNotePositions(note) {
      const t = noteToPitch[note];
      if (t === undefined) return [];
      const out = [];
      strings.forEach(s => { for (let f = 0; f <= fretCount; f++) if ((s.pitch + f) % 12 === t) out.push({ stringNumber: s.number, fret: f }); });
      return out;
    }
    function getAllChordTonePositions() {
      const ch = currentChord();
      if (!ch) return [];
      return ch.formula.flatMap(([note, role]) => getAllNotePositions(note).map(p => ({ ...p, note, role })));
    }
    function getNearbyChordTones(anchor) {
      const ch = currentChord();
      if (!anchor || !ch) return [];
      return getAllChordTonePositions().filter(p => {
        if (p.note === ch.root && p.fret === anchor.fret && p.stringNumber === anchor.stringNumber) return false;
        return Math.abs(p.fret - anchor.fret) <= 3 || (anchor.fret <= 3 && p.fret === 0);
      }).sort((a, b) => { const d = Math.abs(a.fret - anchor.fret) - Math.abs(b.fret - anchor.fret); return d || a.stringNumber - b.stringNumber; }).slice(0, 8);
    }

    const cagedOrder = ["C", "A", "G", "E", "D"];
    const cagedInfo = { C: "C 形家族常用 5 弦和 2 弦附近的根音定位。", A: "A 形以 5 弦根音最直观。", G: "G 形跨度大，多用来连接相邻区域。", E: "E 形以 6 弦根音最直观。", D: "D 形集中在高音弦。" };
    const cagedPalette = { C: { line: "#e66f55" }, A: { line: "#1f9a8a" }, G: { line: "#7a70c8" }, E: { line: "#df9a2f" }, D: { line: "#4b95d7" } };
    const cagedAnchors = { C: [{ stringNumber: 2 }, { stringNumber: 5 }], A: [{ stringNumber: 5 }], G: [{ stringNumber: 1 }, { stringNumber: 3 }, { stringNumber: 6 }], E: [{ stringNumber: 1 }, { stringNumber: 6 }], D: [{ stringNumber: 2 }, { stringNumber: 4 }] };
    function getRootFretsOnString(root, sn) {
      const s = getStringInfo(sn), t = noteToPitch[root], out = [];
      for (let f = 0; f <= fretCount; f++) if ((s.pitch + f) % 12 === t) out.push(f);
      return out;
    }
    function getTightestAnchorSet(opts) {
      const combos = opts.reduce((sets, a) => sets.flatMap(set => a.frets.map(fret => [...set, { ...a, fret }])), [[]]);
      return combos.sort((a, b) => {
        const af = a.map(x => x.fret), bf = b.map(x => x.fret);
        const ar = Math.max(...af) - Math.min(...af), br = Math.max(...bf) - Math.min(...bf);
        return ar !== br ? ar - br : Math.min(...af) - Math.min(...bf);
      })[0] || [];
    }
    function getCagedModel(root, shape) {
      const anchors = cagedAnchors[shape].map(a => ({ ...a, frets: getRootFretsOnString(root, a.stringNumber), row: strings.findIndex(s => s.number === a.stringNumber) + 1 })).filter(a => a.frets.length);
      const tight = getTightestAnchorSet(anchors);
      const minF = Math.min(...tight.map(a => a.fret)), maxF = Math.max(...tight.map(a => a.fret));
      const startFret = Math.max(0, Math.min(minF - 1, fretCount - 4));
      const endFret = Math.min(fretCount, Math.max(maxF + 1, startFret + 4));
      return { anchors: tight, startFret, endFret, range: `${startFret}-${endFret}品` };
    }
    function cagedMiniHTML(root, shape) {
      const model = getCagedModel(root, shape), cells = [];
      for (let r = 1; r <= 6; r++) for (let c = 1; c <= 5; c++) cells.push(`<span class="caged-mini-cell" style="grid-row:${r};grid-column:${c}"></span>`);
      model.anchors.forEach(a => { const col = a.fret - model.startFret + 1; if (col < 1 || col > 5) return; cells.push(`<span class="caged-root-dot" style="grid-row:${a.row};grid-column:${col}">${root}</span>`); });
      return cells.join("");
    }

    const adv = { caged: "E", anchor: null };
    function renderAdvanced() {
      const ch = currentChord();
      const grid = document.getElementById("cagedGrid");
      if (!ch) {
        document.getElementById("cagedRoot").textContent = "—";
        grid.innerHTML = `<div class="adv-note" style="grid-column:1/-1">先按出一个和弦。</div>`;
        document.getElementById("cagedNote").textContent = "";
        document.getElementById("anchorGrid").innerHTML = "";
        document.getElementById("anchorSummary").textContent = "先按出一个和弦。";
        document.getElementById("nearbyTones").innerHTML = "";
        return;
      }
      const root = ch.root;
      document.getElementById("cagedRoot").textContent = root;
      grid.innerHTML = cagedOrder.map(shape => {
        const pal = cagedPalette[shape], model = getCagedModel(root, shape);
        return `<div class="caged-card ${shape === adv.caged ? "active" : ""}" data-caged="${shape}" style="--cl:${pal.line}">
          <div class="caged-head"><span class="caged-letter">${shape}</span><span class="caged-range">${model.range}</span></div>
          <div class="caged-mini">${cagedMiniHTML(root, shape)}</div></div>`;
      }).join("");
      document.getElementById("cagedNote").textContent = cagedInfo[adv.caged];
      const rootPos = getAllNotePositions(root);
      if (!adv.anchor || !rootPos.some(p => p.stringNumber === adv.anchor.stringNumber && p.fret === adv.anchor.fret)) adv.anchor = rootPos[0] || null;
      document.getElementById("anchorGrid").innerHTML = rootPos.slice(0, 6).map(p => {
        const active = adv.anchor && p.stringNumber === adv.anchor.stringNumber && p.fret === adv.anchor.fret;
        return `<div class="anchor-btn ${active ? "active" : ""}" data-anchor="${p.stringNumber}-${p.fret}">${p.stringNumber}弦 ${p.fret}品</div>`;
      }).join("");
      const a = adv.anchor;
      document.getElementById("anchorSummary").textContent = a ? `把 ${a.stringNumber} 弦 ${a.fret} 品的 ${root} 当家门口，在附近找出 ${ch.formula.slice(1).map(f => f[0]).join(" / ")}。` : "";
      document.getElementById("nearbyTones").innerHTML = getNearbyChordTones(a).map(p => `<div class="nearby-tone"><b>${p.note} · ${roleText[p.role] || ""}</b><span>${p.stringNumber}弦 ${p.fret}品</span></div>`).join("");
    }

    let quizIndex = 0;
    function renderQuiz() {
      const ch = currentChord();
      const pr = document.getElementById("quizPrompt"), rv = document.getElementById("quizReveal");
      document.getElementById("quizFeedback").textContent = "";
      if (!ch) { pr.textContent = "先按出一个和弦，我来出题。"; rv.dataset.answer = ""; return; }
      const third = ch.formula.find(f => f[1] === "b3" || f[1] === "3");
      const prompts = [
        { q: `不用看图：${ch.symbol} 的组成音是什么？`, a: ch.formula.map(f => `${f[0]} 是${roleText[f[1]] || f[1]}`).join("，") + "。" },
        { q: `在指板上任选一个 ${ch.root}，接下来要找哪些音才能组成 ${ch.symbol}？`, a: `继续找 ${ch.formula.slice(1).map(f => f[0]).join("、")}。` },
        { q: `${ch.symbol} 的三度是什么？为什么它决定明暗？`, a: `三度是 ${third ? third[0] : "—"}。大三度更亮，小三度更暗。` }
      ];
      const p = prompts[quizIndex % prompts.length];
      pr.textContent = p.q; rv.dataset.answer = p.a;
    }

    function render() {
      const match = recognize();
      document.getElementById("modeTag").textContent = window.matchMedia("(min-width: 820px)").matches ? "iPad · 工作台" : "iPhone · 教练";

      // boards
      renderBoard(document.getElementById("coachBoard"), true, "400px");
      renderBoard(document.getElementById("benchBoard"), false, "clamp(200px, 30vh, 290px)");
      renderIntervalOverlay(document.getElementById("coachBoard"));
      renderIntervalOverlay(document.getElementById("benchBoard"));

      const voicings = match ? chordVoicings(match.root, formulaOf(match)) : [];

      // COACH
      if (match) {
        document.getElementById("coachName").textContent = match.symbol;
        document.getElementById("coachSub").textContent = "已识别 · " + formulaOf(match).map(f => f[0]).join(" ");
        document.getElementById("coachDiagram").innerHTML = diagramSVG(state.frets, 88);
        document.getElementById("coachIntervals").innerHTML = plainIntervals(match);
        document.getElementById("coachWhy").textContent = whyText(match);
        document.getElementById("coachVoicings").innerHTML = voicings.map(v =>
          `<button class="voice-card" data-frets="${v.frets.map(f=>f===null?'x':f).join('-')}">${diagramSVG(v.frets, 76)}<div class="vn">${shapeString(v.frets)}</div></button>`).join("");
      } else {
        document.getElementById("coachName").textContent = "—";
        document.getElementById("coachSub").textContent = "点指板按出你的和弦（至少 2 个音）";
        document.getElementById("coachDiagram").innerHTML = diagramSVG(state.frets, 88);
        document.getElementById("coachIntervals").innerHTML = `<div style="color:var(--muted);font-size:14px">按下不同弦上的音，这里会用大白话告诉你它们的音程关系。</div>`;
        document.getElementById("coachWhy").textContent = "按出一个和弦，我来告诉你它为什么这么按。";
        document.getElementById("coachVoicings").innerHTML = `<div style="color:var(--muted);font-size:13px">识别后这里给你同一个和弦的其它按法。</div>`;
      }

      // BENCH
      if (match) {
        document.getElementById("benchName").textContent = match.symbol;
        document.getElementById("benchSub").textContent = "已识别 · 组成音 " + formulaOf(match).map(f => f[0]).join(" ");
        document.getElementById("benchWheel").innerHTML = wheelSVG(match);
        const ext = match.extra ? "有附加音" : "无多余音";
        const omit = match.missingRoles.length ? "省略 " + match.missingRoles.map(r => roleText[r] || r).join("、") : "完整";
        document.getElementById("benchReadout").innerHTML = `
          <div class="ro"><div class="k">根音</div><div class="v">${match.root}</div></div>
          <div class="ro"><div class="k">类型</div><div class="v">${match.template.label || "大三和弦"}</div></div>
          <div class="ro"><div class="k">完整度</div><div class="v">${omit}</div></div>
          <div class="ro"><div class="k">附加</div><div class="v">${ext}</div></div>`;
        document.getElementById("benchWhy").textContent = whyText(match);
        const curKey = state.frets.join(",");
        document.getElementById("benchShelf").innerHTML = voicings.map(v => {
          const active = v.frets.join(",") === curKey ? "active" : "";
          const reg = v.anchor.stringNumber + "弦" + v.anchor.fret + "品";
          return `<div class="shelf-item ${active}" data-frets="${v.frets.map(f=>f===null?'x':f).join('-')}">
            <div style="flex:0 0 auto">${diagramSVG(v.frets, 46)}</div>
            <div><div class="si-name">${reg} 根音</div><div class="si-shape">${shapeString(v.frets)}</div></div></div>`;
        }).join("");
      } else {
        document.getElementById("benchName").textContent = "—";
        document.getElementById("benchSub").textContent = "点指板按出你的和弦（至少 2 个音）";
        document.getElementById("benchWheel").innerHTML = "";
        document.getElementById("benchReadout").innerHTML = "";
        document.getElementById("benchWhy").textContent = "音程轮会实时画出你按下的音之间的关系。";
        document.getElementById("benchShelf").innerHTML = `<div style="color:var(--muted);font-size:13px">识别后这里列出全指板的不同把位，点一个就载入。</div>`;
      }

      renderAdvanced();
      renderQuiz();
    }

    /* ---------- interactions ---------- */
    document.addEventListener("click", e => {
      const cagedBtn = e.target.closest("[data-caged]");
      if (cagedBtn) { adv.caged = cagedBtn.dataset.caged; renderAdvanced(); return; }
      const anchorBtn = e.target.closest("[data-anchor]");
      if (anchorBtn) { const [s, f] = anchorBtn.dataset.anchor.split("-").map(Number); adv.anchor = { stringNumber: s, fret: f }; renderAdvanced(); return; }
      const label = e.target.closest("[data-strlabel]");
      if (label) {
        const sn = Number(label.dataset.strlabel);
        const idx = 6 - sn;
        state.frets[idx] = state.frets[idx] === null ? 0 : null;
        render();
        return;
      }
      const cell = e.target.closest("[data-string][data-fret]");
      if (cell) {
        const sn = Number(cell.dataset.string), f = Number(cell.dataset.fret);
        const idx = 6 - sn;
        state.frets[idx] = state.frets[idx] === f ? null : f;
        const s = strings.find(x => x.number === sn);
        if (state.frets[idx] !== null) pluck(s.midi, f);
        render();
        return;
      }
      const v = e.target.closest("[data-frets]");
      if (v) {
        loadVoicing(v.dataset.frets.split("-").map(x => x === "x" ? null : Number(x)));
      }
    });

    window.addEventListener("resize", render);

    document.getElementById("quizReveal").addEventListener("click", () => {
      document.getElementById("quizFeedback").textContent = document.getElementById("quizReveal").dataset.answer || "";
    });
    document.getElementById("quizNext").addEventListener("click", () => { quizIndex++; renderQuiz(); });
    const advToggle = document.getElementById("advToggle"), advFold = document.getElementById("advFold");
    advToggle.addEventListener("click", () => {
      const open = advFold.hasAttribute("hidden");
      advFold.toggleAttribute("hidden", !open);
      advToggle.classList.toggle("open", open);
      advToggle.setAttribute("aria-expanded", String(open));
    });

    if (window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) document.body.classList.add("standalone-pwa");

    // seed: Am7 open
    state.frets = [null, 0, 2, 0, 1, 0];
    render();

    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
