<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17201b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GuitarFret">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <title>GuitarFret - 和弦指板 Guide</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201b;
      --muted: #66746d;
      --line: #d8ded8;
      --panel: #ffffff;
      --bg: #f5f2ea;
      --wood: #c98d55;
      --wood-dark: #8d5730;
      --root: #d94d38;
      --third: #1b7f79;
      --fifth: #6f5aa7;
      --seventh: #d18916;
      --ghost: #eef1ee;
      --focus: #174f8a;
      --shadow: 0 14px 38px rgba(38, 30, 18, .12);
      --pwa-safe-top: max(env(safe-area-inset-top), 44px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(245, 242, 234, .94), rgba(245, 242, 234, .98)),
        radial-gradient(circle at 20% 10%, rgba(217, 77, 56, .13), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(27, 127, 121, .12), transparent 24%);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top);
      background: var(--bg);
      pointer-events: none;
      z-index: 100;
    }

    body.standalone-pwa::before {
      height: var(--pwa-safe-top);
      background:
        linear-gradient(180deg, rgba(245, 242, 234, .99), rgba(245, 242, 234, .96)),
        var(--bg);
    }

    body.standalone-pwa {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid rgba(23, 79, 138, .22);
      border-color: var(--focus);
    }

    .app {
      width: min(1220px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 12px 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    body.standalone-pwa .app {
      position: fixed;
      top: var(--pwa-safe-top);
      right: max(env(safe-area-inset-right), 16px);
      bottom: 0;
      left: max(env(safe-area-inset-left), 16px);
      width: auto;
      height: auto;
      min-height: 0;
      padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 740px;
      line-height: 1.45;
    }

    .practice-switch {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .72);
      border-radius: 10px;
    }

    .practice-switch button {
      border: 0;
      background: transparent;
      min-width: 84px;
    }

    .practice-switch button.active {
      background: var(--ink);
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, .85fr);
      gap: 12px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .board-column,
    .side {
      min-height: 0;
      overflow: hidden;
      scrollbar-gutter: stable;
    }

    .toolbar,
    .panel {
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(216, 222, 216, .9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.35fr .85fr;
      gap: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    .control-group > span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .root-picker,
    .quality-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .root-picker button,
    .quality-picker button {
      min-height: 36px;
      padding: 6px 9px;
      font-weight: 900;
      background: #fff;
    }

    .root-picker button.active,
    .quality-picker button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }

    .fretboard-panel {
      padding: 12px;
      min-height: 100%;
    }

    .board-sticky {
      position: sticky;
      top: 0;
      align-self: start;
      background: rgba(255, 255, 255, .92);
      border-radius: 8px;
      padding-bottom: 8px;
      z-index: 8;
    }

    .selected-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .selected-title h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef1ee;
      color: #35433c;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .fretboard-wrap {
      position: relative;
      overflow-x: auto;
      padding: 6px 0 12px;
    }

    .fretboard {
      position: relative;
      min-width: 760px;
      height: 248px;
      display: grid;
      grid-template-columns: 54px repeat(13, 1fr);
      grid-template-rows: repeat(6, 1fr);
      background: linear-gradient(90deg, #f2c78a, #bd7e44);
      border: 2px solid var(--wood-dark);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24);
    }

    .fretboard.vertical {
      min-width: 0;
      width: 100%;
      height: min(58vh, 520px);
      grid-template-columns: 32px repeat(6, 1fr);
      grid-template-rows: 46px repeat(13, 1fr);
    }

    .nut {
      grid-row: 1 / 7;
      grid-column: 1;
      background: #efe5d2;
      border-right: 4px solid #534338;
      z-index: 1;
    }

    .fretboard.vertical .nut {
      grid-row: 1;
      grid-column: 2 / 8;
      border-right: 0;
      border-bottom: 4px solid #534338;
    }

    .cell {
      position: relative;
      border-right: 2px solid rgba(82, 59, 41, .48);
      border-left: 0;
      border-top: 0;
      border-bottom: 0;
      border-radius: 0;
      min-height: 0;
      padding: 0;
      background: transparent;
    }

    .fretboard.vertical .cell {
      border-right: 0;
      border-bottom: 2px solid rgba(82, 59, 41, .48);
    }

    .string-wire {
      content: "";
      position: relative;
      align-self: center;
      justify-self: stretch;
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(130,136,135,.78) 42%, rgba(52,56,55,.72) 58%, rgba(255,255,255,.38));
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .35),
        0 2px 3px rgba(45, 31, 18, .25);
      pointer-events: none;
      z-index: 2;
    }

    .fretboard.vertical .string-wire {
      align-self: stretch;
      justify-self: center;
      width: 2px;
      height: auto !important;
      background: linear-gradient(90deg, rgba(255,255,255,.88), rgba(130,136,135,.78) 42%, rgba(52,56,55,.72) 58%, rgba(255,255,255,.38));
    }

    .fretboard.vertical .string-wire.wound {
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.22) 0 2px, rgba(82,69,53,.18) 2px 4px),
        linear-gradient(90deg, #d7c9a2, #8a795a 45%, #3e372b 58%, #c7b889);
    }

    .string-wire.wound {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 2px, rgba(82,69,53,.18) 2px 4px),
        linear-gradient(180deg, #d7c9a2, #8a795a 45%, #3e372b 58%, #c7b889);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .42),
        0 2px 4px rgba(48, 32, 18, .32);
    }

    .string-label {
      display: grid;
      place-items: center;
      color: #4b3c32;
      font-weight: 900;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, .18);
      z-index: 2;
      cursor: pointer;
    }

    .fretboard.vertical .string-label {
      border-bottom: 0;
      border-right: 1px solid rgba(255, 255, 255, .18);
    }

    .string-label:hover {
      background: rgba(255, 255, 255, .38);
    }

    .string-label.muted {
      color: #8e3328;
      background: rgba(255, 255, 255, .72);
      font-size: 23px;
    }

    .string-label.open-string {
      color: var(--focus);
      box-shadow: inset 0 0 0 2px rgba(23, 79, 138, .22);
    }

    .fret-number {
      position: relative;
      align-self: end;
      justify-self: center;
      bottom: 5px;
      color: rgba(51, 38, 27, .62);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      z-index: 2;
    }

    .fretboard.vertical .fret-number {
      align-self: center;
      justify-self: start;
      bottom: auto;
      left: 4px;
    }

    .caged-region {
      position: relative;
      align-self: stretch;
      justify-self: stretch;
      border: 2px dashed var(--caged-line);
      background: var(--caged-fill);
      background:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, .1) 0 8px, rgba(255, 255, 255, 0) 8px 18px),
        var(--caged-fill);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .32),
        0 0 0 1px rgba(255, 255, 255, .36);
      pointer-events: none;
      z-index: 1;
    }

    .caged-region.active {
      border-width: 3px;
      border-style: dashed;
      background: var(--caged-fill-strong);
      background:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, .16) 0 8px, rgba(255, 255, 255, 0) 8px 18px),
        var(--caged-fill-strong);
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, .48),
        0 0 0 2px rgba(23, 32, 27, .16);
      z-index: 2;
    }

    .caged-region-label {
      position: absolute;
      top: 6px;
      left: 6px;
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: #1f2b25;
      font-size: 12px;
      font-weight: 900;
      border: 1px dashed var(--caged-line);
      box-shadow: 0 2px 8px rgba(40, 30, 18, .12);
    }

    .fretboard.vertical .caged-region-label {
      top: 5px;
      left: 4px;
      writing-mode: vertical-rl;
      min-height: 34px;
      min-width: 22px;
      justify-content: center;
    }

    .marker {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 34px;
      height: 30px;
      width: 30px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, .82);
      box-shadow: 0 8px 18px rgba(50, 33, 20, .26);
      z-index: 3;
    }

    .marker.root { background: var(--root); }
    .marker.third { background: var(--third); }
    .marker.fifth { background: var(--fifth); }
    .marker.seventh { background: var(--seventh); }

    .all-note-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 24px;
      height: 22px;
      width: 22px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .74);
      border: 2px solid var(--focus);
      color: var(--focus);
      font-size: 10px;
      font-weight: 900;
      z-index: 2;
    }

    .all-note-marker.open {
      width: 28px;
      height: 28px;
    }

    .root-anchor-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 40px;
      width: 40px;
      border-radius: 50%;
      border: 4px solid var(--ink);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, .65);
      pointer-events: none;
      z-index: 4;
    }

    .input-fret-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid #10231a;
      background: rgba(255, 255, 255, .88);
      color: #10231a;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(30, 20, 12, .25);
      z-index: 5;
      padding: 0;
      min-height: 0;
    }

    .input-fret-marker.root,
    .input-fret-marker.third,
    .input-fret-marker.fifth,
    .input-fret-marker.seventh {
      color: #fff;
      border-color: rgba(255, 255, 255, .86);
    }

    .input-fret-marker.root { background: var(--root); }
    .input-fret-marker.third { background: var(--third); }
    .input-fret-marker.fifth { background: var(--fifth); }
    .input-fret-marker.seventh { background: var(--seventh); }

    .interval-arc-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      overflow: visible;
    }

    .interval-arc-path {
      fill: none;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      stroke-width: 2.4;
      opacity: .86;
      filter: drop-shadow(0 2px 2px rgba(27, 20, 12, .2));
    }

    .interval-arc-label {
      position: absolute;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(23, 32, 27, .16);
      background: rgba(255, 255, 255, .94);
      color: #18221d;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 7;
      box-shadow: 0 3px 10px rgba(28, 20, 12, .18);
    }

    .muted-string {
      display: grid;
      place-items: center;
      color: #5b332a;
      font-size: 18px;
      font-weight: 900;
      z-index: 4;
    }

    .voicing-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .voicing-card {
      text-align: left;
      min-height: 76px;
      padding: 9px;
      border-radius: 8px;
      background: var(--panel);
    }

    .voicing-card.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .voicing-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .voicing-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.28;
    }

    .side {
      display: grid;
      gap: 10px;
      grid-auto-rows: min-content;
      overflow: hidden;
    }

    .panel {
      padding: 12px;
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .song-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .song-chord {
      min-height: 58px;
      padding: 9px;
      text-align: left;
      background: #fff;
    }

    .song-chord.active {
      border-color: var(--root);
      box-shadow: inset 0 0 0 1px var(--root);
    }

    .song-chord strong {
      display: block;
      font-size: 18px;
    }

    .song-chord small {
      color: var(--muted);
      font-weight: 800;
    }

    .answer {
      margin: 0;
      color: #2f3b35;
      line-height: 1.62;
      font-size: 15px;
      max-height: 96px;
      overflow: auto;
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .note-pill {
      padding: 9px;
      border-radius: 8px;
      color: #fff;
      min-height: 58px;
      min-height: 52px;
      border: 2px solid transparent;
      text-align: left;
      cursor: pointer;
    }

    .note-pill b {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .note-pill.root { background: var(--root); }
    .note-pill.third { background: var(--third); }
    .note-pill.fifth { background: var(--fifth); }
    .note-pill.seventh { background: var(--seventh); }
    .note-pill.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .85);
    }

    .note-map-status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .mode-panel {
      display: none;
    }

    .mode-panel.active {
      display: block;
    }

    .recognizer {
      display: grid;
      gap: 8px;
    }

    .fingering-input-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    .fingering-input-row input {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 800;
    }

    .analysis-result {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mute-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .mute-row button {
      min-height: 32px;
      padding: 5px 4px;
      font-size: 12px;
      font-weight: 900;
    }

    .analysis-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      min-height: 58px;
    }

    .analysis-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .analysis-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .anchor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .anchor-button {
      text-align: left;
      padding: 8px;
      background: #fff;
      min-height: 58px;
    }

    .anchor-button.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .anchor-button strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .anchor-button span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .anchor-summary {
      margin: 0 0 10px;
      color: #2f3b35;
      line-height: 1.58;
      font-size: 15px;
    }

    .nearby-tones {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .nearby-tone {
      display: grid;
      gap: 2px;
      min-height: 58px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .nearby-tone b {
      font-size: 16px;
    }

    .nearby-tone span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .caged-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }

    .caged-button {

    function getSymbol(root, quality) {
      return `${root}${qualityTemplates[quality].suffix}`;
    }

    function pitchName(pitch) {
      const preferred = {
        0: "C",
        1: "C#",
        2: "D",
        3: "Eb",
        4: "E",
        5: "F",
        6: "F#",
        7: "G",
        8: "Ab",
        9: "A",
        10: "Bb",
        11: "B"
      };
      return preferred[((pitch % 12) + 12) % 12];
    }

    function getNoteLetter(root, degree) {
      const start = noteLetters.indexOf(root[0]);
      return noteLetters[(start + degree - 1) % noteLetters.length];
    }

    function spellInterval(root, semitones, degree) {
      const targetPitch = (noteToPitch[root] + semitones) % 12;
      const letter = getNoteLetter(root, degree);
      const naturalPitch = noteToPitch[letter];
      let diff = (targetPitch - naturalPitch + 12) % 12;
      if (diff > 6) diff -= 12;
      if (diff === 0) return letter;
      if (diff === 1) return `${letter}#`;
      if (diff === -1) return `${letter}b`;
      return pitchDisplay[pitchClasses[targetPitch]] || pitchClasses[targetPitch];
    }

    function inferCagedFromAnchor(anchor) {
      if (anchor.stringNumber === 6 || anchor.stringNumber === 1) return "E";
      if (anchor.stringNumber === 5) return "A";
      if (anchor.stringNumber === 4 || anchor.stringNumber === 2) return "D";
      return "G";
    }

    function getToneForPitch(formula, pitch) {
      return formula.find(([note]) => noteToPitch[note] === pitch);
    }

    function formatShape(frets) {
      return frets.map(fret => fret === null ? "x" : String(fret)).join("-");
    }

    function fretsToInputValue(frets) {
      return frets.map(fret => fret === null ? "x" : String(fret)).join("-");
    }

    let audioContext;

    function playGuitarNote(stringNumber, fret) {
      const stringInfo = getStringInfo(stringNumber);
      if (!stringInfo || fret === null) return;
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;
      const frequency = 440 * Math.pow(2, ((stringInfo.midi + fret) - 69) / 12);
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.997, now + 0.26);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(2200, now);
      filter.frequency.exponentialRampToValueAtTime(620, now + 0.22);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.75);
    }

    function getGeneratedVoicing(anchor, chord) {
      const frets = [null, null, null, null, null, null];
      const roles = [null, null, null, null, null, null];
      const notes = [null, null, null, null, null, null];
      const formulaPitches = new Set(chord.formula.map(([note]) => noteToPitch[note]));

      strings.forEach(stringInfo => {
        const dataIndex = 6 - stringInfo.number;
        let candidates = [];
        for (let fret = 0; fret <= fretCount; fret += 1) {
          const pitch = (stringInfo.pitch + fret) % 12;
          if (!formulaPitches.has(pitch)) continue;
          const inArea = Math.abs(fret - anchor.fret) <= 3;
          const openNearNut = anchor.fret <= 3 && fret === 0;
          if (inArea || openNearNut || (stringInfo.number === anchor.stringNumber && fret === anchor.fret)) {
            const tone = getToneForPitch(chord.formula, pitch);
            candidates.push({ fret, note: tone[0], role: tone[1], distance: Math.abs(fret - anchor.fret) });
          }
        }

        if (stringInfo.number === anchor.stringNumber) {
          candidates = [{ fret: anchor.fret, note: chord.root, role: "1", distance: 0 }];
        }

        if (!candidates.length) return;
        candidates.sort((a, b) => a.distance - b.distance || a.fret - b.fret);
        const picked = candidates[0];
        frets[dataIndex] = picked.fret;
        roles[dataIndex] = picked.role;
        notes[dataIndex] = picked.note;
      });

      const caged = inferCagedFromAnchor(anchor);
      const shape = formatShape(frets);
      return {
        name: `${anchor.stringNumber} 弦 ${anchor.fret} 品根音区域`,
        shape,
        frets,
        roles,
        notes,
        desc: `以 ${anchor.stringNumber} 弦 ${anchor.fret} 品的 ${chord.root} 为中心，在附近找出 ${chord.formula.slice(1).map(([note]) => note).join(" / ")}。`,
        tag: `${caged} shape area`,
        caged
      };
    }

    function buildChord(root, quality) {
      const template = qualityTemplates[quality];
      const formula = template.tones.map(tone => [
        spellInterval(root, tone.semitones, tone.degree),
        tone.role
      ]);
      const chord = {
        root,
        symbol: getSymbol(root, quality),
        formula,
        qualityLabel: template.label,
        why: `${getSymbol(root, quality)} 不是固定按法，而是 ${formula.map(([note, role]) => `${note}(${roleText[role]})`).join("、")} 这些音的组合。先在指板上找到 ${root}，再围绕它找三度、五度和七度，按法只是这些音的一个排列。`,
        voicings: []
      };
      const rootPositions = getAllNotePositions(root)
        .filter(position => position.stringNumber >= 4 || position.fret <= 5)
        .slice(0, 5);
      chord.voicings = rootPositions.map(position => getGeneratedVoicing(position, chord));
      return chord;
    }

      if (name === "9" || name === "13" || name === "7") return "7";

    function getAllNotePositions(note) {
      const targetPitch = noteToPitch[note];
      if (targetPitch === undefined) return [];

      return strings.flatMap((stringInfo, stringIndex) => {
        const row = stringIndex + 1;
        const positions = [];
        for (let fret = 0; fret <= fretCount; fret += 1) {
          if ((stringInfo.pitch + fret) % 12 === targetPitch) {
            positions.push({
              stringNumber: stringInfo.number,
              fret,
              row,
              column: fret === 0 ? 1 : fret + 1
            });
          }
        }
        return positions;
      });
    }

    function isVerticalFretboard() {
      return window.matchMedia("(max-width: 520px)").matches;

    function getDisplayStrings(vertical) {
      return vertical ? [...strings].reverse() : strings;

    function getBoardPosition(stringNumber, fret, vertical) {
      if (vertical) {
        const column = getDisplayStrings(true).findIndex(stringInfo => stringInfo.number === stringNumber) + 2;
        return {
          column,
          row: fret === 0 ? 1 : fret + 1
        };
      }
      const row = strings.findIndex(stringInfo => stringInfo.number === stringNumber) + 1;
      return {
        row,
        column: fret === 0 ? 1 : fret + 1
      };

    function getAllChordTonePositions() {
      const chord = getCurrentChord();
      return chord.formula.flatMap(([note, role]) =>

          role

    function getNearbyChordTones(anchor) {
      if (!anchor) return [];
      return getAllChordTonePositions()
        .filter(position => {
          if (position.note === getCurrentChord().root && position.fret === anchor.fret && position.stringNumber === anchor.stringNumber) {
            return false;
          }
          const sameArea = Math.abs(position.fret - anchor.fret) <= 3;
          const openNearNut = anchor.fret <= 3 && position.fret === 0;
          return sameArea || openNearNut;
        })
        .sort((a, b) => {
          const distance = Math.abs(a.fret - anchor.fret) - Math.abs(b.fret - anchor.fret);
          if (distance !== 0) return distance;
          return a.stringNumber - b.stringNumber;
        })
        .slice(0, 8);

    function renderCagedRegions(root, vertical) {
      if (state.mode !== "caged") return [];

      if (isInputMode) {
        const inputFormula = getInputDisplayFormula();
        state.inputFrets.forEach((fret, stringIndex) => {
          if (fret === null) return;
          const stringNumber = 6 - stringIndex;
          const pos = getBoardPosition(stringNumber, fret, vertical);
          const stringInfo = getStringInfo(stringNumber);
          const pitch = (stringInfo.pitch + fret) % 12;
          const chordTone = inputFormula.find(([note]) => noteToPitch[note] === pitch);
          const note = chordTone ? chordTone[0] : pitchName(pitch);
          const role = chordTone ? chordTone[1] : "";
          const roleLabel = roleText[role] || "非和弦内音";
          rows.push(`
            <div style="position:relative;grid-column:${pos.column};grid-row:${pos.row};z-index:5">
              <button class="input-fret-marker ${roleClass[role] || ""}" type="button" data-input-selected="true" data-input-string="${stringNumber}" data-input-fret="${fret}" data-role="${role}" title="${note} ${roleLabel}，再次点击设为不发音">${note}</button>
            </div>
          `);
        });
      }

      if (!isInputMode) {
        voicing.frets.forEach((fret, stringIndex) => {
          const role = voicing.roles[stringIndex];
          const note = voicing.notes[stringIndex];
          const stringNumber = 6 - stringIndex;
          const pos = getBoardPosition(stringNumber, fret === null ? 0 : fret, vertical);
          if (fret === null) {
            rows.push(`<div class="muted-string" style="grid-column:${pos.column};grid-row:${pos.row}">×</div>`);
            return;
          }

          const roleLabel = roleText[role] || "";
          const marker = `<button class="marker ${roleClass[role] || "root"}" type="button" data-note="${note}" data-string="${stringNumber}" data-fret="${fret}" title="${note} ${roleLabel}">${note}</button>`;
          rows.push(`<div style="position:relative;grid-column:${pos.column};grid-row:${pos.row};z-index:3">${marker}</div>`);
        });
      }

      el.fretboard.innerHTML = rows.join("");
      el.noteMapStatus.textContent = isInputMode
        ? "点击指板录入指法；点弦名录入空弦。"
        : `${state.selectedNote}: 0-${fretCount} 品内共 ${selectedPositions.length} 个位置`;
      requestAnimationFrame(renderIntervalArcs);
    }

    function roleColor(role) {
      return {
        "1": getComputedStyle(document.documentElement).getPropertyValue("--root").trim() || "#d94d38",
        "b3": getComputedStyle(document.documentElement).getPropertyValue("--third").trim() || "#1b7f79",
        "3": getComputedStyle(document.documentElement).getPropertyValue("--third").trim() || "#1b7f79",
        "b5": getComputedStyle(document.documentElement).getPropertyValue("--fifth").trim() || "#6f5aa7",
        "5": getComputedStyle(document.documentElement).getPropertyValue("--fifth").trim() || "#6f5aa7",
        "b7": getComputedStyle(document.documentElement).getPropertyValue("--seventh").trim() || "#d18916",
        "7": getComputedStyle(document.documentElement).getPropertyValue("--seventh").trim() || "#d18916",
        "9": getComputedStyle(document.documentElement).getPropertyValue("--seventh").trim() || "#d18916",
        "11": getComputedStyle(document.documentElement).getPropertyValue("--third").trim() || "#1b7f79",
        "13": getComputedStyle(document.documentElement).getPropertyValue("--fifth").trim() || "#6f5aa7"
      }[role] || "#31423a";
    }

    function renderIntervalArcs() {
      el.fretboard.querySelector(".interval-arc-svg")?.remove();
      el.fretboard.querySelectorAll(".interval-arc-label").forEach(label => label.remove());
      if (state.mode !== "input") return;
      const recognition = getInputRecognition();
      if (!recognition || !recognition.main) return;

      const rootMarker = [...el.fretboard.querySelectorAll('.input-fret-marker[data-role="1"]')]
        .sort((a, b) => Number(b.dataset.inputString) - Number(a.dataset.inputString) || Number(a.dataset.inputFret) - Number(b.dataset.inputFret))[0];
      if (!rootMarker) return;

      const boardRect = el.fretboard.getBoundingClientRect();
      const rootRect = rootMarker.getBoundingClientRect();
      const start = {
        x: rootRect.left + rootRect.width / 2 - boardRect.left,
        y: rootRect.top + rootRect.height / 2 - boardRect.top
      };
      const targets = [...el.fretboard.querySelectorAll(".input-fret-marker[data-role]")]
        .filter(marker => marker !== rootMarker && marker.dataset.role !== "1");
      if (!targets.length) return;
      const markerRects = [...el.fretboard.querySelectorAll(".input-fret-marker")].map(marker => {
        const rect = marker.getBoundingClientRect();
        return {
          left: rect.left - boardRect.left - 10,
          right: rect.right - boardRect.left + 10,
          top: rect.top - boardRect.top - 8,
          bottom: rect.bottom - boardRect.top + 8
        };
      });
      const placedLabelRects = [];
      const overlaps = (a, b) =>
        a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
      const labelRect = (x, y, width) => ({
        left: x - width / 2,
        right: x + width / 2,
        top: y - 13,
        bottom: y + 13
      });
      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const vertical = el.fretboard.classList.contains("vertical");
      const labelBounds = {
        minX: vertical ? 42 : 88,
        maxX: boardRect.width - 12,
        minY: vertical ? 72 : 18,
        maxY: vertical ? boardRect.height - 18 : boardRect.height - 44
      };
      const hasCollision = rect => [...markerRects, ...placedLabelRects].some(occupied => overlaps(rect, occupied));

      const defs = `
        <defs>
          ${targets.map(marker => `
            <marker id="arrow-${marker.dataset.inputString}-${marker.dataset.inputFret}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L8,4 L0,8 Z" fill="${roleColor(marker.dataset.role)}"></path>
            </marker>
          `).join("")}
        </defs>
      `;
      const labels = [];
      const paths = targets.map((marker, index) => {
        const rect = marker.getBoundingClientRect();
        const end = {
          x: rect.left + rect.width / 2 - boardRect.left,
          y: rect.top + rect.height / 2 - boardRect.top
        };
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const distance = Math.hypot(dx, dy) || 1;
        const normal = { x: -dy / distance, y: dx / distance };
        const bend = 38 + (index % 3) * 12;
        const direction = index % 2 === 0 ? 1 : -1;
        const control = {
          x: (start.x + end.x) / 2 + normal.x * bend * direction,
          y: (start.y + end.y) / 2 + normal.y * bend * direction
        };
        const label = roleText[marker.dataset.role] || "";
        const labelWidth = Math.max(48, label.length * 14 + 18);
        const tangent = { x: dx / distance, y: dy / distance };
        const targetAnchor = {
          x: end.x + tangent.x * 18,
          y: end.y + tangent.y * 18
        };
        const offsets = [30, -30, 46, -46, 62, -62, 0, 78, -78];
        const minX = Math.min(labelBounds.maxX - labelWidth / 2, labelBounds.minX + labelWidth / 2);
        const maxX = Math.max(labelBounds.minX + labelWidth / 2, labelBounds.maxX - labelWidth / 2);
        let labelX = clamp(targetAnchor.x + normal.x * offsets[0], minX, maxX);
        let labelY = clamp(targetAnchor.y + normal.y * offsets[0], labelBounds.minY, labelBounds.maxY);
        for (const offset of offsets) {
          const candidateX = clamp(targetAnchor.x + normal.x * offset, minX, maxX);
          const candidateY = clamp(targetAnchor.y + normal.y * offset, labelBounds.minY, labelBounds.maxY);
          const candidateRect = labelRect(candidateX, candidateY, labelWidth);
          if (!hasCollision(candidateRect)) {
            labelX = candidateX;
            labelY = candidateY;
            break;
          }
        }
        placedLabelRects.push(labelRect(labelX, labelY, labelWidth));
        const color = roleColor(marker.dataset.role);
        labels.push(`<span class="interval-arc-label" style="left:${labelX}px;top:${labelY}px;min-width:${labelWidth}px">${label}</span>`);

        return `
          <path class="interval-arc-path" d="M ${start.x} ${start.y} Q ${control.x} ${control.y} ${end.x} ${end.y}" stroke="${color}" marker-end="url(#arrow-${marker.dataset.inputString}-${marker.dataset.inputFret})"></path>
        `;
      }).join("");

      el.fretboard.insertAdjacentHTML("beforeend", `
        <svg class="interval-arc-svg" viewBox="0 0 ${boardRect.width} ${boardRect.height}" aria-hidden="true">
          ${defs}
          ${paths}
        </svg>
        ${labels.join("")}
      `);
    }

    function renderVoicings() {
      const chord = getCurrentChord();
      if (state.mode === "input") {
        el.voicingList.innerHTML = "";
        return;
      }
      el.voicingList.innerHTML = chord.voicings.map((voicing, index) => `
        <button class="voicing-card ${index === state.voicingIndex ? "active" : ""}" type="button" data-voicing-index="${index}">
          <strong>${voicing.name}</strong>
          <span>${voicing.shape}</span>
          <span>${voicing.desc}</span>
        </button>
      `).join("");
    }

    function renderAnchorGuide() {
      const item = getCurrentChordItem();
      const chord = getCurrentChord();
      const rootPositions = getAllNotePositions(chord.root);
      if (!state.selectedRootAnchor) state.selectedRootAnchor = getVoicingRootAnchor() || rootPositions[0];
      const anchor = state.selectedRootAnchor;
      const nearby = getNearbyChordTones(anchor);

      el.anchorTitle.textContent = `${item.symbol}: 先选一个 ${chord.root}`;
      el.anchorGrid.innerHTML = rootPositions.slice(0, 6).map(position => {
        const active = anchor && position.stringNumber === anchor.stringNumber && position.fret === anchor.fret;
        return `
          <button class="anchor-button ${active ? "active" : ""}" type="button" data-string="${position.stringNumber}" data-fret="${position.fret}">
            <strong>${position.stringNumber} 弦 ${position.fret} 品</strong>
            <span>${chord.root} 作为根音入口</span>
          </button>
        `;
      }).join("");
      el.anchorSummary.textContent = `把 ${anchor.stringNumber} 弦 ${anchor.fret} 品的 ${chord.root} 当作家门口，先在它附近找 ${chord.formula.slice(1).map(([note]) => note).join(" / ")}。找到这些音以后，按法只是把这些音组织成舒服的手型。`;
      el.nearbyTones.innerHTML = nearby.map(position => `
        <div class="nearby-tone">
          <b>${position.note} · ${roleText[position.role]}</b>
          <span>${position.stringNumber} 弦 ${position.fret} 品</span>
        </div>
      `).join("");
    }

    function getStringInfo(stringNumber) {
      return strings.find(stringInfo => stringInfo.number === stringNumber);
    }

    function getRootFretsOnString(root, stringNumber) {
      const stringInfo = getStringInfo(stringNumber);
      const targetPitch = noteToPitch[root];
      const frets = [];
      for (let fret = 0; fret <= fretCount; fret += 1) {
        if ((stringInfo.pitch + fret) % 12 === targetPitch) frets.push(fret);
      }
      return frets;
    }

    function getTightestAnchorSet(anchorOptions) {
      const combinations = anchorOptions.reduce((sets, anchor) => {
        return sets.flatMap(set =>
          anchor.frets.map(fret => [...set, { ...anchor, fret }])
        );
      }, [[]]);

      return combinations.sort((a, b) => {
        const aFrets = a.map(anchor => anchor.fret);
        const bFrets = b.map(anchor => anchor.fret);
        const aRange = Math.max(...aFrets) - Math.min(...aFrets);
        const bRange = Math.max(...bFrets) - Math.min(...bFrets);
        if (aRange !== bRange) return aRange - bRange;
        return Math.min(...aFrets) - Math.min(...bFrets);
      })[0] || [];
    }

    function getCagedModel(root, shape) {
      const anchors = cagedAnchors[shape].map(anchor => ({
        ...anchor,
        frets: getRootFretsOnString(root, anchor.stringNumber),
        row: strings.findIndex(stringInfo => stringInfo.number === anchor.stringNumber) + 1
      })).filter(anchor => anchor.frets.length);
      const tightAnchors = getTightestAnchorSet(anchors);
      const minFret = Math.min(...tightAnchors.map(anchor => anchor.fret));
      const maxFret = Math.max(...tightAnchors.map(anchor => anchor.fret));
      const startFret = Math.max(0, Math.min(minFret - 1, fretCount - 4));
      const endFret = Math.min(fretCount, Math.max(maxFret + 1, startFret + 4));

      return {
        anchors: tightAnchors,
        startFret,
        endFret,
        range: `${startFret}-${endFret}品`
      };
    }

    function renderCagedMiniBoard(root, shape) {
      const model = getCagedModel(root, shape);
      const cells = [];

      for (let row = 1; row <= 6; row += 1) {
        for (let column = 1; column <= 5; column += 1) {
          cells.push(`<span class="caged-mini-cell" style="grid-row:${row};grid-column:${column}"></span>`);
        }
      }

      model.anchors.forEach(anchor => {
        const column = anchor.fret - model.startFret + 1;
        if (column < 1 || column > 5) return;
        cells.push(`
          <span class="caged-root-dot" style="grid-row:${anchor.row};grid-column:${column}" title="${anchor.label} ${anchor.fret}品">
            ${root}
          </span>
        `);
      });

      return cells.join("");
    }

    function renderCagedGuide() {
      const item = getCurrentChordItem();
      const chord = getCurrentChord();
      const voicing = getCurrentVoicing();
      const available = new Map();
      chord.voicings.forEach((shape, index) => {
        if (!available.has(shape.caged)) available.set(shape.caged, index);
      });
      const selected = state.selectedCaged || voicing.caged;
      const selectedIndex = available.get(selected);
      const selectedVoicing = selectedIndex === undefined ? null : chord.voicings[selectedIndex];
      const rootPositions = getAllNotePositions(chord.root).map(position =>
        `${position.stringNumber}弦${position.fret}品`
      ).join(" / ");

      el.cagedTitle.textContent = `${item.symbol} 的 CAGED 视角`;
      el.cagedButtons.innerHTML = cagedOrder.map(shape => {
        const palette = cagedPalette[shape];
        const vars = `--caged-line:${palette.line};--caged-fill:${palette.fill};--caged-fill-strong:${palette.strong}`;
        return `
          <button class="caged-button ${shape === selected ? "active" : ""} ${available.has(shape) ? "" : "missing"}" type="button" data-caged="${shape}" style="${vars}">
            <span class="caged-button-head">
              <span class="caged-letter">${shape}</span>
              <span class="caged-range">${getCagedModel(chord.root, shape).range}</span>
            </span>
            <span class="caged-mini-board" aria-label="${shape} 形根音地图">
              ${renderCagedMiniBoard(chord.root, shape)}
            </span>
            <span class="caged-string-hint">${cagedAnchors[shape].map(anchor => anchor.label).join(" / ")}</span>
          </button>
        `;
      }).join("");
      el.cagedSummary.textContent = selectedVoicing
        ? `${selected} 形家族：当前可用按法是 ${selectedVoicing.shape}。${cagedInfo[selected]}`
        : `${selected} 形家族：这个原型还没有收录 ${item.symbol} 的完整示例，但逻辑一样，先找 ${chord.root} 的根音位置，再在附近按 ${selected} 形骨架补出三度、五度和七度。`;
      el.cagedMeta.innerHTML = `
        <span>当前按法：${voicing.caged} 形</span>
        <span>根音：${chord.root}</span>
        <span>根音位置：${rootPositions}</span>
      `;
    }

    function getLetterPath(fromNote, toNote) {
      const from = fromNote[0];
      const to = toNote[0];
      const path = [from];
      let index = noteLetters.indexOf(from);

      while (path[path.length - 1] !== to && path.length < 8) {
        index = (index + 1) % noteLetters.length;
        path.push(noteLetters[index]);
      }

      return path;
    }

    function getChromaticPath(fromNote, toNote) {
      const from = noteToPitch[fromNote];
      const to = noteToPitch[toNote];
      const distance = (to - from + 12) % 12;

      return Array.from({ length: distance + 1 }, (_, index) => {
        const pitch = pitchClasses[(from + index) % 12];
        return pitchDisplay[pitch] || pitch;
      });
    }

    function renderIntervalGuide() {
      const chord = getCurrentChord();
      const root = chord.formula[0][0];
      const third = chord.formula.find(([, role]) => role === "b3" || role === "3") || chord.formula[1];
      const target = third[0];
      const role = third[1];
      const letterPath = getLetterPath(root, target);
      const chromaticPath = getChromaticPath(root, target);
      const semitones = chromaticPath.length - 1;
      const intervalName = intervalBySemitones[semitones] || roleText[role];

      el.intervalTitle.textContent = `为什么 ${root} 到 ${target} 是${intervalName}？`;
      el.intervalSummary.textContent = `${root} 到 ${target} 先按字母名数：${letterPath.join("-")}，所以它属于“三度”。再按半音数数：${chromaticPath.join(" -> ")}，一共 ${semitones} 个半音。三度里 3 个半音叫小三度，4 个半音叫大三度。`;
      el.letterSteps.innerHTML = letterPath.map((note, index) => `
        <span class="letter-step ${index === 0 || index === letterPath.length - 1 ? "active" : ""}">${note}</span>
        ${index < letterPath.length - 1 ? '<span class="step-link">下一字母</span>' : ""}
      `).join("");
      el.chromaticSteps.innerHTML = chromaticPath.map((note, index) => `
        <span class="chromatic-step ${index === 0 || index === chromaticPath.length - 1 ? "active" : ""}">${note}</span>
        ${index < chromaticPath.length - 1 ? '<span class="step-link">+1 半音</span>' : ""}
      `).join("");
    }

    function renderExplanation() {
      const item = getCurrentChordItem();
      const chord = getCurrentChord();
      const voicing = getCurrentVoicing();
      const inputRecognition = state.mode === "input" ? getInputRecognition() : null;
      const inputFormula = inputRecognition && inputRecognition.main ? formulaFromMatch(inputRecognition.main) : null;
      const displayFormula = state.mode === "input" ? inputFormula || [] : chord.formula;
      const displaySymbol = state.mode === "input"
        ? inputRecognition
          ? inputRecognition.main
            ? inputRecognition.main.symbol
            : "输入指法识别"
          : "格式错误"
        : item.symbol;
      const displayShape = state.mode === "input" ? el.fingeringInput.value : voicing.shape;
      el.voicingTitle.textContent = `${displaySymbol} · ${displayShape}`;
      el.shapeBadge.textContent = state.mode === "input" ? "识别结果" : voicing.tag;
      el.whyTitle.textContent = `为什么 ${item.symbol} 可以这样弹？`;
      el.whyText.textContent = state.mode === "anchor"
        ? `先别管 CAGED 名字。把 ${chord.root} 当成地图入口，选一个你想落脚的根音位置，然后在附近找出 ${chord.formula.slice(1).map(([note]) => note).join("、")}。这样你是在用音组成和弦，不是在背一个按法。`
        : state.mode === "caged"
        ? `CAGED 的价值是把散落的根音变成五个熟悉区域。先点出 ${chord.root} 在全指板的位置，再选择 C/A/G/E/D 形状家族，就能知道这个和弦可以在哪个区域展开。`
        : state.mode === "voice"
        ? getVoiceLeadingText(item.symbol)
        : chord.why;
      el.notes.innerHTML = displayFormula.length
        ? displayFormula.map(([note, role]) => `
          <button class="note-pill ${roleClass[role]} ${note === state.selectedNote ? "active" : ""}" type="button" data-note="${note}">
            <b>${note}</b>
            <span>${roleText[role]}</span>
          </button>
        `).join("")
        : `<div class="analysis-card"><strong>等待输入</strong><span>点击指板后显示识别出的组成音。</span></div>`;
      renderAnchorGuide();
      renderCagedGuide();
      renderIntervalGuide();
    }

    function getVoiceLeadingText(symbol) {
      const chord = getCurrentChord();
      const third = chord.formula.find(([, role]) => role === "b3" || role === "3");
      const seventh = chord.formula.find(([, role]) => role === "b7" || role === "7");
      if (seventh) {
        return `${symbol} 里最值得盯住的是 ${third[0]}(${roleText[third[1]]}) 和 ${seventh[0]}(${roleText[seventh[1]]})。根音告诉你落点，三度决定大小色彩，七度决定张力；换下一个和弦时，优先观察这两个音怎么移动。`;
      }
      return `${symbol} 里最值得先看的是 ${chord.root}(根音)、${third[0]}(${roleText[third[1]]}) 和 ${chord.formula.find(([, role]) => role === "5")[0]}(五度)。先找根音，再判断三度是大三度还是小三度，和弦性格就清楚了。`;
    }

    function renderPrompt() {
      const chord = getCurrentChord();
      const generatedPrompts = [
        {
          q: `不用看图，先回答：${chord.symbol} 的组成音是什么？`,
          a: chord.formula.map(([note, role]) => `${note} 是${roleText[role]}`).join("，") + "。"
        },
        {
          q: `在指板上任选一个 ${chord.root}，你接下来要找哪些音才能组成 ${chord.symbol}？`,
          a: `要继续找 ${chord.formula.slice(1).map(([note]) => note).join("、")}。`
        },
        {
          q: `${chord.symbol} 的三度是什么？它为什么决定和弦的明暗？`,
          a: `三度是 ${chord.formula.find(([, role]) => role === "b3" || role === "3")[0]}。大三度听起来更明亮，小三度听起来更暗。`
        }
      ];
      const prompt = generatedPrompts[state.promptIndex % generatedPrompts.length];
      el.prompt.textContent = prompt.q;
      el.reveal.dataset.answer = prompt.a;
      el.feedback.textContent = "";
    }

    const recognitionTemplates = [
      { name: "maj9", label: "maj9", intervals: { "1": 0, "3": 4, "5": 7, "7": 11, "9": 2 }, essential: ["1", "3", "7", "9"], type: "extended" },
      { name: "m9", label: "m9", intervals: { "1": 0, "b3": 3, "5": 7, "b7": 10, "9": 2 }, essential: ["1", "b3", "b7", "9"], type: "extended" },
      { name: "9", label: "9", intervals: { "1": 0, "3": 4, "5": 7, "b7": 10, "9": 2 }, essential: ["1", "3", "b7", "9"], type: "extended" },
      { name: "m11", label: "m11", intervals: { "1": 0, "b3": 3, "5": 7, "b7": 10, "9": 2, "11": 5 }, essential: ["1", "b3", "b7", "11"], type: "extended" },
      { name: "13", label: "13", intervals: { "1": 0, "3": 4, "5": 7, "b7": 10, "9": 2, "13": 9 }, essential: ["1", "3", "b7", "13"], type: "extended" },
      { name: "maj7", label: "maj7", intervals: { "1": 0, "3": 4, "5": 7, "7": 11 }, essential: ["1", "3", "7"], type: "basic" },
      { name: "m7", label: "m7", intervals: { "1": 0, "b3": 3, "5": 7, "b7": 10 }, essential: ["1", "b3", "b7"], type: "basic" },
      { name: "7", label: "7", intervals: { "1": 0, "3": 4, "5": 7, "b7": 10 }, essential: ["1", "3", "b7"], type: "basic" },
      { name: "m7b5", label: "m7b5", intervals: { "1": 0, "b3": 3, "b5": 6, "b7": 10 }, essential: ["1", "b3", "b5", "b7"], type: "basic" },
      { name: "m", label: "m", intervals: { "1": 0, "b3": 3, "5": 7 }, essential: ["1", "b3"], type: "basic" },
      { name: "", label: "", intervals: { "1": 0, "3": 4, "5": 7 }, essential: ["1", "3"], type: "basic" }
    ];

    function parseFingering(value) {
      const parts = value.trim().replace(/[，, ]+/g, "-").split("-").filter(Boolean);
      if (parts.length !== 6) return null;
      const frets = parts.map(part => {
        const normalized = part.toLowerCase();
        if (normalized === "x" || normalized === "mute") return null;
        const fret = Number(normalized);
        return Number.isInteger(fret) && fret >= 0 && fret <= 24 ? fret : NaN;
      });
      return frets.some(Number.isNaN) ? null : frets;
    }

    function getFingeringNotes(frets) {
      return frets.flatMap((fret, index) => {
        if (fret === null) return [];
        const stringNumber = 6 - index;
        const stringInfo = getStringInfo(stringNumber);
        const pitch = (stringInfo.pitch + fret) % 12;
        return [{
          stringNumber,
          fret,
          pitch,
          note: pitchName(pitch)
        }];
      });
    }

    function scoreTemplate(pitchSet, rootPitch, template) {
      const present = Object.entries(template.intervals).filter(([, interval]) =>
        pitchSet.has((rootPitch + interval) % 12)
      ).map(([role]) => role);
      const missing = Object.entries(template.intervals).filter(([role, interval]) =>
        role !== "1" && !pitchSet.has((rootPitch + interval) % 12)
      ).map(([role]) => role);
      const essentialMissing = template.essential.filter(role =>
        !pitchSet.has((rootPitch + template.intervals[role]) % 12)
      );
      const extra = [...pitchSet].filter(pitch =>
        !Object.values(template.intervals).some(interval => (rootPitch + interval) % 12 === pitch)
      );
      const score = present.length * 3 - missing.length - essentialMissing.length * 5 - extra.length * 2 + (template.type === "extended" ? 1 : 0);
      return { template, present, missing, essentialMissing, extra, score };
    }

    function findBestChordMatches(notes) {
      const pitchSet = new Set(notes.map(note => note.pitch));
      const rootPitches = [...pitchSet];
      const matches = [];
      rootPitches.forEach(rootPitch => {
        recognitionTemplates.forEach(template => {
          const scored = scoreTemplate(pitchSet, rootPitch, template);
          if (scored.essentialMissing.length <= 1 && scored.present.includes("1")) {
            matches.push({
              ...scored,
              root: pitchName(rootPitch),
              symbol: `${pitchName(rootPitch)}${template.label}`
            });
          }
        });
      });
      matches.sort((a, b) => b.score - a.score || b.present.length - a.present.length);
      return matches;
    }

    function getInputRecognition() {
      const frets = parseFingering(el.fingeringInput.value);
      if (!frets) return null;
      const notes = getFingeringNotes(frets);
      if (!notes.length) return { frets, notes, matches: [], basic: null, extended: null, main: null };
      const matches = findBestChordMatches(notes);
      const basic = matches.find(match => match.template.type === "basic") || null;
      const extended = matches.find(match => match.template.type === "extended" && match.score >= (basic ? basic.score - 2 : 0)) || null;
      return {
        frets,
        notes,
        matches,
        basic,
        extended,
        main: extended || basic || matches[0] || null
      };
    }

    function formulaFromMatch(match) {
      if (!match) return null;
      return Object.entries(match.template.intervals)
        .sort(([roleA], [roleB]) => formulaRoleOrder.indexOf(roleA) - formulaRoleOrder.indexOf(roleB))
        .map(([role, semitones]) => [
          spellInterval(match.root, semitones, degreeByRole[role] || 1),
          role
        ]);
    }

    function getInputDisplayFormula() {
      const recognition = getInputRecognition();
      return recognition && recognition.main ? formulaFromMatch(recognition.main) : getCurrentChord().formula;
    }

    function renderFingeringAnalysis() {
      const recognition = getInputRecognition();
      if (!recognition) {
        el.analysisResult.innerHTML = `<div class="analysis-card"><strong>格式错误</strong><span>请输入 6 弦到 1 弦，例如 x-5-7-5-6-5。</span></div>`;
        return;
      }
      state.inputFrets = recognition.frets;
      const notes = recognition.notes;
      if (!notes.length) {
        el.analysisResult.innerHTML = `
          <div class="analysis-card">
            <strong>等待输入</strong>
            <span>直接点击左侧空指板。每根弦只保留一个位置。</span>
          </div>
          <div class="analysis-card">
            <strong>实际音</strong>
            <span>暂无</span>
          </div>
        `;
        return;
      }
      const { basic, extended, main } = recognition;
      const noteText = notes.map(note => `${note.stringNumber}弦${note.fret}品=${note.note}`).join(" / ");
      const omit = main ? main.missing.map(role => roleText[role] || role).join("、") : "";

      el.analysisResult.innerHTML = `
        <div class="analysis-card">
          <strong>基础和弦</strong>
          <span>${basic ? basic.symbol : "未识别"}${basic ? ` · ${basic.present.join(" ")}` : ""}</span>
        </div>
        <div class="analysis-card">
          <strong>扩展和弦</strong>
          <span>${extended ? extended.symbol : "未包含 9/11/13 等扩展音"}</span>
        </div>
        <div class="analysis-card">
          <strong>省略音</strong>
          <span>${omit ? `omit ${omit}` : "无明显省略音"}</span>
        </div>
        <div class="analysis-card">
          <strong>实际音</strong>
          <span>${noteText}</span>
        </div>
      `;
    }

    function render() {
      if (!state.selectedRootAnchor) resetChordLens();
      el.fingeringInput.value = fretsToInputValue(state.inputFrets);
      renderChordControls();
      renderFretboard();
      renderVoicings();
      renderExplanation();
      renderFingeringAnalysis();
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll("[data-mode]").forEach(item => {
        item.classList.toggle("active", item.dataset.mode === mode);
      });
      document.querySelectorAll("[data-panel]").forEach(panel => {
        panel.classList.toggle("active", panel.dataset.panel === mode);
      });
    }

    function renderInputRecognitionView() {
      renderChordControls();
      renderFretboard();
      renderFingeringAnalysis();
      renderExplanation();
    }

    el.rootPicker.addEventListener("click", event => {
      const button = event.target.closest("[data-root]");
      if (!button) return;
      state.root = button.dataset.root;
      state.voicingIndex = 0;
      resetChordLens();
      setMode("map");
      render();
    });

    el.qualityPicker.addEventListener("click", event => {
      const button = event.target.closest("[data-quality]");
      if (!button) return;
      state.quality = button.dataset.quality;
      state.voicingIndex = 0;
      resetChordLens();
      setMode("map");
      render();
    });

    el.voicingList.addEventListener("click", event => {
      const button = event.target.closest("[data-voicing-index]");
      if (!button) return;
      state.voicingIndex = Number(button.dataset.voicingIndex);
      state.selectedCaged = getCurrentVoicing().caged;
      state.selectedRootAnchor = getVoicingRootAnchor();
      render();
    });

    el.anchorGrid.addEventListener("click", event => {
      const button = event.target.closest("[data-string]");
      if (!button) return;
      state.selectedRootAnchor = {
        stringNumber: Number(button.dataset.string),
        fret: Number(button.dataset.fret)
      };
      state.selectedNote = getCurrentChord().root;
      render();
    });

    el.cagedButtons.addEventListener("click", event => {
      const button = event.target.closest("[data-caged]");
      if (!button) return;
      const shape = button.dataset.caged;
      const matchIndex = getCurrentChord().voicings.findIndex(voicing => voicing.caged === shape);
      state.selectedCaged = shape;
      state.selectedNote = getCurrentChord().root;
      if (matchIndex >= 0) {
        state.voicingIndex = matchIndex;
        state.selectedRootAnchor = getVoicingRootAnchor();
      }
      render();
    });

    el.notes.addEventListener("click", event => {
      const button = event.target.closest("[data-note]");
      if (!button) return;
      state.selectedNote = button.dataset.note;
      render();
    });

    el.fretboard.addEventListener("click", event => {
      const selectedInput = event.target.closest("[data-input-selected]");
      if (selectedInput) {
        const stringNumber = Number(selectedInput.dataset.inputString);
        state.inputFrets[6 - stringNumber] = null;
        el.fingeringInput.value = fretsToInputValue(state.inputFrets);
        setMode("input");
        renderInputRecognitionView();
        return;
      }

      const inputTarget = event.target.closest("[data-input-string], [data-string][data-fret]");
      if (inputTarget) {
        const stringNumber = Number(inputTarget.dataset.inputString || inputTarget.dataset.string);
        const fret = Number(inputTarget.dataset.inputFret || inputTarget.dataset.fret);
        if (Number.isInteger(stringNumber) && Number.isInteger(fret)) {
          state.inputFrets[6 - stringNumber] = fret;
          el.fingeringInput.value = fretsToInputValue(state.inputFrets);
          playGuitarNote(stringNumber, fret);
          setMode("input");
          renderInputRecognitionView();
        }
        if (state.mode === "input") return;
      }

      const button = event.target.closest("[data-note]");
      if (!button) return;
      state.selectedNote = button.dataset.note;
      if (button.dataset.note === getCurrentChord().root && button.dataset.string) {
        state.selectedRootAnchor = {
          stringNumber: Number(button.dataset.string),
          fret: Number(button.dataset.fret)
        };
      }
      render();
    });

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        setMode(button.dataset.mode);
        renderChordControls();
        renderFretboard();
        renderVoicings();
        renderExplanation();
        if (state.mode === "quiz") renderPrompt();
      });
    });

    el.analyzeFingering.addEventListener("click", renderInputRecognitionView);
    el.fingeringInput.addEventListener("input", () => {
      const frets = parseFingering(el.fingeringInput.value);
      if (frets) {
        state.inputFrets = frets;
        setMode("input");
      }
      renderInputRecognitionView();
    });
    el.clearFingering.addEventListener("click", () => {
      state.inputFrets = [null, null, null, null, null, null];
      el.fingeringInput.value = fretsToInputValue(state.inputFrets);
      setMode("input");
      renderInputRecognitionView();
    });

    el.muteRow.addEventListener("click", event => {
      const button = event.target.closest("[data-mute-string]");
      if (!button) return;
      const stringNumber = Number(button.dataset.muteString);
      state.inputFrets[6 - stringNumber] = null;
      el.fingeringInput.value = fretsToInputValue(state.inputFrets);
      setMode("input");
      renderInputRecognitionView();
    });

    window.addEventListener("resize", () => {
      requestAnimationFrame(renderIntervalArcs);
    });

    el.reveal.addEventListener("click", () => {
      el.feedback.textContent = el.reveal.dataset.answer || "";
    });

    el.newPrompt.addEventListener("click", () => {
      state.promptIndex = (state.promptIndex + 1) % prompts.length;
      renderPrompt();
    });

    render();
    renderPrompt();

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
