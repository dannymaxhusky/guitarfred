<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E16">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <title>GuitarFret - Chord Inspector</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fdfbf7;
      --canvas: #eef1f5;
      --card: #ffffff;
      --navy: #243047;
      --muted: #7c8698;
      --line: #ede8df;
      --line-strong: #ded4c7;
      --coral: #ff7e6b;
      --coral-dark: #e8604c;
      --teal: #1f6f6b;
      --teal-soft: #d9eeec;
      --gold: #f4b860;
      --lav: #e8e4ff;
      --peach: #ffe9e0;
      --shadow: 0 18px 48px rgba(36, 48, 71, .12);
      --fret-cols: 64px 46px 1.88fr 1.78fr 1.68fr 1.59fr 1.5fr 1.42fr 1.34fr 1.27fr 1.2fr 1.13fr 1.07fr 1fr;
      --font: "DM Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-family: var(--font);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--canvas);
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--canvas);
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .page {
      min-height: 100vh;
      padding: 18px;
    }

    .app {
      width: min(1360px, 100%);
      margin: 0 auto;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(36, 48, 71, .16);
      overflow: hidden;
    }

    .topbar {
      min-height: 60px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .58);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: var(--teal);
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(31, 111, 107, .22);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
    }

    .compact-result {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip,
    .ghost,
    .primary,
    .language-select {
      min-height: 36px;
      border-radius: 999px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
    }

    .chip {
      color: var(--teal);
      background: var(--teal-soft);
    }

    .ghost {
      color: var(--navy);
      background: #f4f0e8;
    }

    .language-control {
      flex: 0 0 auto;
    }

    .language-select {
      min-width: 104px;
      border: 0;
      color: var(--navy);
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(36, 48, 71, .14);
      cursor: pointer;
    }

    .language-select:focus-visible {
      outline: 3px solid rgba(31, 111, 107, .28);
      outline-offset: 2px;
    }

    .primary {
      color: #fff;
      background: var(--coral);
      box-shadow: 0 12px 24px rgba(255, 126, 107, .28);
    }

    .workspace {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .fret-panel {
      padding: 20px;
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .panel-head p {
      margin: 6px 0 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }

    .fret-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .fretboard {
      min-width: 860px;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #fffaf3, #fbf4e9);
    }

    .fret-numbers,
    .string-row {
      display: grid;
      grid-template-columns: var(--fret-cols);
    }

    .fret-numbers {
      min-height: 38px;
      color: var(--muted);
      background: rgba(255, 255, 255, .62);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
    }

    .fret-numbers span,
    .string-label {
      display: grid;
      place-items: center;
    }

    .string-row {
      min-height: 40px;
      position: relative;
    }

    .string-row::after {
      content: "";
      position: absolute;
      left: 64px;
      right: 0;
      top: 50%;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(36, 48, 71, .3), rgba(145, 154, 169, .72), rgba(36, 48, 71, .32));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .75), 0 0 6px rgba(31, 111, 107, .08);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 1;
    }

    .string-row.wound::after {
      height: 4px;
      background:
        repeating-linear-gradient(90deg, rgba(145, 106, 62, .76) 0 5px, rgba(221, 187, 132, .72) 6px 8px),
        linear-gradient(90deg, rgba(101, 74, 48, .52), rgba(210, 172, 110, .72));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .72), 0 0 8px rgba(244, 184, 96, .12);
    }

    .string-row.vibrating::after {
      opacity: 0;
    }

    .string-wave {
      position: absolute;
      left: 64px;
      right: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }

    .wave-glow,
    .wave-core {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .wave-glow {
      stroke: rgba(36, 48, 71, .16);
      stroke-width: 7;
      filter: blur(1px);
    }

    .wave-core {
      stroke: rgba(93, 101, 116, .78);
      stroke-width: 2.4;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .72));
    }

    .string-row.wound .wave-core {
      stroke-width: 4.5;
      stroke: rgba(145, 106, 62, .78);
    }

    .string-row.wound .wave-glow {
      stroke: rgba(183, 139, 77, .18);
      stroke-width: 8;
    }

    .string-row.vibrating .wave-glow,
    .string-row.vibrating .wave-core {
      opacity: 1;
    }

    .string-row + .string-row {
      border-top: 1px solid rgba(36, 48, 71, .08);
    }

    .string-label {
      position: relative;
      z-index: 3;
      color: var(--navy);
      background: rgba(36, 48, 71, .06);
      font-size: 13px;
      font-weight: 900;
    }

    .string-cell {
      position: relative;
      min-width: 0;
      background: transparent;
      color: var(--navy);
      border-left: 1px solid rgba(36, 48, 71, .13);
      display: grid;
      place-items: center;
    }

    .string-cell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      background: rgba(36, 48, 71, .42);
      pointer-events: none;
      opacity: 0;
    }

    .string-row.wound .string-cell::before {
      height: 4px;
      background: rgba(183, 139, 77, .48);
    }

    .string-cell[data-fret="0"] {
      border-left: 5px solid rgba(36, 48, 71, .82);
    }

    .dot {
      width: 36px;
      min-width: 36px;
      height: 36px;
      min-height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1px;
      place-items: center;
      color: transparent;
      background: transparent;
      border: 2px solid transparent;
      position: relative;
      z-index: 2;
      font-size: 12px;
      font-weight: 900;
      overflow: visible;
      transition: transform .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
    }

    .dot::before,
    .dot::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    .dot::before {
      inset: -11px;
      border-radius: 50%;
      border: 2px solid rgba(255, 126, 107, .48);
      box-shadow: 0 0 0 6px rgba(255, 126, 107, .08), inset 0 0 16px rgba(255, 255, 255, .22);
    }

    .dot::after {
      width: 7px;
      height: 28px;
      border-radius: 999px;
      left: 50%;
      top: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0));
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, .86));
      transform: translate(-50%, -50%) rotate(-32deg);
    }

    .dot-note {
      font-size: 13px;
      position: relative;
      z-index: 2;
      line-height: 1;
    }

    .dot-interval {
      display: none;
      position: relative;
      z-index: 2;
      font-size: 10px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .string-cell:hover .dot {
      color: rgba(36, 48, 71, .48);
      border-color: rgba(36, 48, 71, .16);
      background: rgba(255, 255, 255, .7);
    }

    .string-cell.selected .dot {
      width: 46px;
      min-width: 46px;
      height: 46px;
      min-height: 46px;
      color: #fff;
      background: var(--coral);
      border-color: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 18px rgba(255, 126, 107, .26);
      transform: scale(1.03);
    }

    .string-cell.root .dot {
      background: var(--teal);
      box-shadow: 0 10px 18px rgba(31, 111, 107, .24);
    }

    .string-cell.open-selected .dot {
      width: 52px;
      min-width: 52px;
      height: 34px;
      min-height: 34px;
      border-radius: 999px;
      color: var(--coral-dark);
      background: rgba(255, 255, 255, .88);
      border-color: rgba(232, 96, 76, .68);
      border-style: dashed;
      box-shadow: 0 7px 14px rgba(255, 126, 107, .14);
      transform: none;
    }

    .string-cell.open-selected.root .dot {
      color: var(--teal);
      background: rgba(217, 238, 236, .76);
      border-color: rgba(31, 111, 107, .68);
      box-shadow: 0 7px 14px rgba(31, 111, 107, .14);
    }

    .string-cell.open-selected .dot::before {
      inset: -7px;
      border-radius: 999px;
    }

    .string-cell.open-selected .dot-note {
      font-size: 12px;
    }

    .string-cell.open-selected .dot-interval {
      font-size: 9px;
    }

    .string-cell.selected .dot-interval {
      display: block;
    }

    .dot.mute-dot {
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      color: var(--coral-dark);
      background: rgba(255, 126, 107, .14);
      border-color: rgba(232, 96, 76, .72);
      border-style: dashed;
      box-shadow: 0 8px 16px rgba(255, 126, 107, .16);
      font-size: 13px;
    }

    .dot.mute-dot .dot-note {
      font-size: 14px;
    }

    .string-cell.muted-open:hover .mute-dot,
    .phone-cell.muted-open:hover .mute-dot {
      color: #fff;
      background: var(--coral);
      border-color: rgba(255, 255, 255, .9);
      box-shadow: 0 10px 18px rgba(255, 126, 107, .26);
    }

    .string-cell.hit .dot {
      animation: pluckPulse .46s cubic-bezier(.2, .9, .2, 1);
    }

    .string-cell.hit .dot::before,
    .phone-cell.hit .dot::before {
      animation: energyRing .62s ease-out both;
    }

    .string-cell.hit .dot::after,
    .phone-cell.hit .dot::after {
      animation: pickGlint .46s ease-out both;
    }

    .string-cell.hit::after {
      content: "";
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 126, 107, .32);
      background: radial-gradient(circle, rgba(255, 255, 255, .42), rgba(255, 126, 107, .16) 44%, rgba(255, 126, 107, 0) 68%);
      animation: rippleOut .48s ease-out both;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes pluckPulse {
      0% { transform: scale(.86); }
      55% { transform: scale(1.22); }
      100% { transform: scale(1.03); }
    }

    @keyframes rippleOut {
      from { opacity: .78; transform: scale(.58); }
      to { opacity: 0; transform: scale(1.45); }
    }

    @keyframes energyRing {
      0% { opacity: .9; transform: scale(.48); }
      64% { opacity: .42; transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.45); }
    }

    @keyframes pickGlint {
      0% { opacity: 0; transform: translate(-130%, -140%) rotate(-32deg) scaleY(.4); }
      30% { opacity: .96; transform: translate(-38%, -58%) rotate(-32deg) scaleY(1); }
      100% { opacity: 0; transform: translate(85%, 62%) rotate(-32deg) scaleY(.55); }
    }

    .phone-fretboard {
      display: none;
    }

    .selected-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 38px;
    }

    .selected-note {
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--navy);
      background: #f4f0e8;
      font-size: 12px;
      font-weight: 900;
    }

    .selected-note b {
      color: var(--teal);
      font-weight: 900;
    }

    .analysis {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(240px, 1fr) minmax(220px, .9fr);
      grid-template-areas:
        "result intervals voicings"
        "explain intervals voicings";
      gap: 12px;
      min-width: 0;
      align-items: stretch;
    }

    .result-card {
      grid-area: result;
      min-width: 0;
      min-height: 132px;
      padding: 16px 96px 16px 18px;
      color: #fff;
      background: linear-gradient(135deg, #ffb199 0%, #ff7e6b 56%, #e8604c 100%);
      border-radius: 20px;
      box-shadow: 0 18px 42px rgba(255, 126, 107, .24);
      overflow: hidden;
      position: relative;
    }

    .result-card::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -70px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 28px solid rgba(255, 255, 255, .14);
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      font-size: 12px;
      font-weight: 900;
      opacity: .86;
      letter-spacing: .3px;
    }

    .chord-name {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      font-size: clamp(38px, 5.5vw, 60px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: 0;
      max-width: 100%;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-wrap: balance;
      font-variant-numeric: tabular-nums;
    }

    .chord-name.long-result {
      font-size: clamp(28px, 3.6vw, 44px);
      line-height: 1;
    }

    .chord-play {
      position: absolute;
      z-index: 2;
      right: 18px;
      top: 50%;
      width: 58px;
      height: 58px;
      min-height: 58px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--coral-dark);
      background: rgba(255, 255, 255, .92);
      box-shadow:
        0 14px 26px rgba(36, 48, 71, .16),
        inset 0 0 0 6px rgba(255, 126, 107, .12);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: translateY(-50%);
    }

    .chord-play[hidden] {
      display: none;
    }

    .chord-play-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--coral);
      box-shadow: 0 10px 18px rgba(255, 126, 107, .32);
    }

    .chord-play-icon::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
    }

    .chord-play:active {
      transform: translateY(calc(-50% + 1px));
    }

    .chord-play-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .chord-meta {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chord-meta span {
      min-height: 26px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      font-size: 11px;
      font-weight: 900;
    }

    .explain-card,
    .interval-card,
    .voicing-card {
      padding: 14px;
      min-width: 0;
    }

    .explain-card {
      grid-area: explain;
    }

    .interval-card {
      grid-area: intervals;
    }

    .voicing-card {
      grid-area: voicings;
    }

    .explain-card h3,
    .interval-card h3,
    .voicing-card h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .why {
      margin: 10px 0 0;
      padding-left: 12px;
      border-left: 3px solid var(--teal);
      color: #4f5b6e;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 700;
    }

    .interval-list {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .interval-row {
      min-height: 42px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fbf8f2;
    }

    .note-token {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--coral);
      font-weight: 900;
    }

    .interval-row.root-note .note-token {
      background: var(--teal);
    }

    .interval-copy b {
      display: block;
      font-size: 13px;
    }

    .interval-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
    }

    .interval-badge {
      justify-self: end;
      min-height: 30px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #5e5795;
      background: var(--lav);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .voicing-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .voicing-list {
      margin-top: 12px;
      display: none;
      gap: 10px;
    }

    .voicing-card.open .voicing-list {
      display: grid;
    }

    .voicing-option {
      padding: 12px;
      border-radius: 16px;
      background: #fbf8f2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(102px, 118px);
      gap: 12px;
      align-items: center;
      cursor: pointer;
    }

    .voicing-option h4 {
      margin: 0;
      font-size: 13px;
      font-weight: 900;
    }

    .voicing-option p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
    }

    .chord-chart {
      width: 100%;
      max-width: 118px;
      height: auto;
      justify-self: center;
      overflow: visible;
    }

    .chord-chart text {
      font-family: var(--font);
      font-weight: 900;
      letter-spacing: 0;
    }

    .chart-string {
      stroke: rgba(36, 48, 71, .24);
      stroke-width: 1.4;
    }

    .chart-fret {
      stroke: rgba(36, 48, 71, .18);
      stroke-width: 1.2;
    }

    .chart-nut {
      stroke: rgba(36, 48, 71, .72);
      stroke-linecap: round;
      stroke-width: 4;
    }

    .chart-dot {
      fill: var(--coral);
      filter: drop-shadow(0 5px 8px rgba(255, 126, 107, .22));
    }

    .chart-dot.root {
      fill: var(--teal);
      filter: drop-shadow(0 5px 8px rgba(31, 111, 107, .22));
    }

    .chart-note {
      fill: #fff;
      font-size: 8px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .chart-open {
      fill: #fff;
      stroke: var(--coral);
      stroke-width: 1.8;
    }

    .chart-open.root {
      stroke: var(--teal);
    }

    .chart-open-label {
      fill: var(--coral-dark);
      font-size: 8px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .chart-open-label.root {
      fill: var(--teal);
    }

    .chart-muted {
      fill: var(--coral-dark);
      font-size: 12px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .chart-string-label,
    .chart-base-fret {
      fill: var(--muted);
      font-size: 9px;
    }

    .empty {
      padding: 14px;
      border-radius: 16px;
      color: var(--muted);
      background: #fbf8f2;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
    }

    @media (min-width: 721px) and (max-height: 900px) {
      .page { padding: 14px; }
      .topbar { min-height: 56px; padding: 10px 18px; }
      .brand h1 { font-size: 18px; }
      .brand p { display: none; }
      .workspace { padding: 12px; gap: 12px; }
      .fret-panel { padding: 14px; gap: 12px; }
      .panel-head h2, .panel-head h3 { font-size: 17px; }
      .panel-head p { display: none; }
      .string-row { min-height: 36px; }
      .fret-numbers { min-height: 32px; }
      .result-card { min-height: 112px; padding: 12px 84px 12px 16px; }
      .chord-name { font-size: clamp(32px, 4.2vw, 48px); }
      .chord-name.long-result { font-size: clamp(24px, 3vw, 36px); }
      .chord-play { width: 52px; height: 52px; min-height: 52px; }
      .chord-play-icon { width: 34px; height: 34px; }
      .chord-meta { margin-top: 6px; }
      .chord-meta span { min-height: 22px; padding: 4px 8px; font-size: 10px; }
      .explain-card, .interval-card, .voicing-card { padding: 12px; }
      .interval-row { min-height: 38px; padding: 6px 8px; }
      .note-token { width: 28px; height: 28px; }
      .why { font-size: 13px; line-height: 1.55; }
    }

    @media (max-width: 1040px) {
      .analysis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "result intervals"
          "explain voicings";
      }
    }

      .page {
        min-height: 100svh;
        padding:

          max(8px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }

      .app {
        min-height: calc(100svh - max(10px, env(safe-area-inset-top)) - max(10px, env(safe-area-inset-bottom)));
        border-radius: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        padding: 10px 12px 11px;
        position: relative;
      }

      .brand {
        width: 100%;
        min-height: 36px;
        gap: 9px;
        padding-right: 106px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        box-shadow: 0 8px 16px rgba(31, 111, 107, .18);
      }

      .brand h1 {
        max-width: 100%;
        font-size: 18px;
        line-height: 1.08;

      }

      .brand p {
        display: none;
      }

      .toolbar {
        width: 100%;

      }

        position: absolute;
        top: 10px;
        right: 12px;
      }

      .ghost,

        min-height: 32px;
        padding: 6px 11px;

      .language-select {

      .workspace {
        padding: 10px;
        gap: 10px;
      }

      .fret-panel,
      .explain-card,

        padding: 10px;
      }

      .fret-panel {
        gap: 9px;
        border-radius: 16px;
      }

      .panel-head {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }

      .panel-head h2,
      .panel-head h3 {
        font-size: 18px;
      }

      .panel-head p {
        display: none;
      }

      #tuningChip {
        flex: 0 0 auto;
        max-width: 58%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .result-card {
        min-height: 118px;
        padding: 18px 92px 18px 18px;
        border-radius: 18px;
      }

      .chord-play {
        right: 18px;
        width: 64px;
        height: 64px;
        min-height: 64px;
        box-shadow:
          0 14px 26px rgba(36, 48, 71, .16),
          inset 0 0 0 7px rgba(255, 126, 107, .12);
      }

      .chord-play-icon {
        width: 44px;
        height: 44px;
      }

      .chord-play-icon::before {
        margin-left: 3px;
        border-top-width: 8px;
        border-bottom-width: 8px;
        border-left-width: 13px;
      }

      .compact-result {
        min-height: 58px;
        padding: 10px 12px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #fff;
        background: linear-gradient(135deg, #ffb199 0%, #ff7e6b 58%, #e8604c 100%);
        box-shadow: 0 10px 22px rgba(255, 126, 107, .18);
      }

      .compact-result b {
        font-size: 34px;
        line-height: 1;
        font-weight: 900;
      }

      .compact-result span {
        max-width: 50%;
        text-align: right;
        font-size: 12px;
        line-height: 1.25;
        font-weight: 900;
      }

      .analysis {
        grid-template-columns: 1fr;
        grid-template-areas:
          "result"
          "explain"
          "intervals"
          "voicings";
      }

      .fret-scroll {
        display: none;
      }

      .phone-fretboard {
        display: grid;
        position: relative;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(180deg, #fffaf3, #fbf4e9);
      }

      .phone-head,
      .phone-fret-row {
        display: grid;
        grid-template-columns: 42px repeat(6, 1fr);
      }

      .phone-head {
        min-height: 30px;
        color: var(--muted);
        background: rgba(255, 255, 255, .62);
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        font-weight: 900;
      }

      .phone-head span,
      .phone-fret-label {
        display: grid;
        place-items: center;
      }

      .phone-head span {
        min-width: 0;
        padding: 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1;
      }

      .phone-head span:first-child {
        font-size: 10px;
      }

      .phone-fret-row + .phone-fret-row {
        border-top: 1px solid rgba(36, 48, 71, .08);
      }

      .phone-fret-label {
        position: relative;
        z-index: 3;
        color: var(--navy);
        background: rgba(36, 48, 71, .06);
        font-size: 11px;
        font-weight: 900;
      }

      .phone-cell {
        position: relative;
        min-width: 0;
        display: grid;
        place-items: center;
        background: transparent;
        border-left: 1px solid rgba(36, 48, 71, .12);
        touch-action: manipulation;
      }

      .phone-cell::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: rgba(36, 48, 71, .42);
        pointer-events: none;
      }

      .phone-cell.vibrating::before {
        animation: phoneStringQuiver 150ms ease-in-out infinite;
      }

      .phone-string-wave {
        position: absolute;
        left: 42px;
        right: 0;
        top: 30px;
        bottom: 0;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }

      .phone-wave-glow,
      .phone-wave-core {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }

      .phone-wave-glow {
        stroke: rgba(36, 48, 71, .16);
        stroke-width: 7;
        filter: blur(1px);
      }

      .phone-wave-core {
        stroke: rgba(93, 101, 116, .78);
        stroke-width: 2.4;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .72));
      }

      .phone-fretboard.wave-wound .phone-wave-glow {
        stroke: rgba(183, 139, 77, .18);
        stroke-width: 8;
      }

      .phone-fretboard.wave-wound .phone-wave-core {
        stroke: rgba(145, 106, 62, .78);
        stroke-width: 4.5;
      }

      .phone-fretboard.vibrating .phone-wave-glow,
      .phone-fretboard.vibrating .phone-wave-core {
        opacity: 0;
      }

      @keyframes phoneStringQuiver {
        0%,
        100% {
          transform: translateX(-50%);
        }

        25% {
          transform: translateX(calc(-50% - 1.5px));
        }

        75% {
          transform: translateX(calc(-50% + 1.5px));
        }
      }

      .phone-cell[data-string="0"]::before,
      .phone-cell[data-string="1"]::before,
      .phone-cell[data-string="2"]::before {
        width: 4px;
        background: rgba(183, 139, 77, .48);
      }

      .phone-fret-row[data-fret="0"] .phone-cell {
        border-top: 5px solid rgba(36, 48, 71, .82);
      }

      .phone-cell:hover .dot {
        color: rgba(36, 48, 71, .48);
        border-color: rgba(36, 48, 71, .16);
        background: rgba(255, 255, 255, .7);
      }

      .phone-cell.selected .dot {
        width: 38px;
        min-width: 38px;
        height: 38px;
        min-height: 38px;
        color: #fff;
        background: var(--coral);
        border-color: rgba(255, 255, 255, .92);
        box-shadow: 0 8px 16px rgba(255, 126, 107, .24);
        transform: scale(1.03);
      }

      .phone-cell.root .dot {
        background: var(--teal);
        box-shadow: 0 10px 18px rgba(31, 111, 107, .24);
      }

      .phone-cell.open-selected .dot {
        width: 34px;
        min-width: 34px;
        height: 28px;
        min-height: 28px;
        border-radius: 999px;
        color: var(--coral-dark);
        background: rgba(255, 255, 255, .88);
        border-color: rgba(232, 96, 76, .68);
        border-style: dashed;
        box-shadow: 0 7px 14px rgba(255, 126, 107, .14);
        margin-left: -6px;
        transform: none;
      }

      .phone-cell.open-selected.root .dot {
        color: var(--teal);
        background: rgba(217, 238, 236, .76);
        border-color: rgba(31, 111, 107, .68);
        box-shadow: 0 7px 14px rgba(31, 111, 107, .14);
      }

      .phone-cell.open-selected .dot::before {
        inset: -7px;
        border-radius: 999px;
      }

      .phone-cell.open-selected .dot-note {
        font-size: 10px;
      }

      .phone-cell.open-selected .dot-interval {
        font-size: 8px;
      }

      .phone-cell.selected .dot-interval {
        display: block;
      }

      .phone-cell.hit .dot {
        animation: pluckPulse .46s cubic-bezier(.2, .9, .2, 1);
      }

      .phone-cell.hit::after {
        content: "";
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid rgba(255, 126, 107, .32);
        background: radial-gradient(circle, rgba(255, 255, 255, .42), rgba(255, 126, 107, .16) 44%, rgba(255, 126, 107, 0) 68%);
        animation: rippleOut .48s ease-out both;
        z-index: 1;
        pointer-events: none;
      }

      .selected-strip {
        display: none;
      }

      .interval-row {
        grid-template-columns: 48px 1fr;
      }

      .interval-badge {
        grid-column: 2;
        justify-self: start;
      }

      .voicing-option {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <div class="page">
    <main class="app" id="appShell" aria-label="GuitarFret 和弦分析器">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">G</div>
          <div>
            <h1 id="appTitle">GuitarFret Chord Inspector</h1>
        <p id="brandTagline">标准调弦 · 实时和弦分析</p>
          </div>
        </div>
        <div class="toolbar" id="toolbar" aria-label="快捷操作">
          <span class="chip" id="selectionCount">已选择 5 个音</span>
          <button class="ghost" type="button" id="demoBtn">Am7 示例</button>

          <label class="language-control" for="languageSelect">

              <option value="zh-Hans">中文</option>
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="ja">日本語</option>
            </select>
          </label>
        </div>
      </header>

      <section class="workspace">
        <section class="panel fret-panel" id="fretPanel" aria-label="可点按指板">
          <div class="panel-head">
            <div>
              <h2 id="fretTitle">指板</h2>
              <p id="fretDescription">当前指法以每根弦一个音建模。</p>
            </div>
            <span class="chip" id="tuningChip">标准调弦 E A D G B E</span>
          </div>

          <div class="compact-result" aria-live="polite">
            <b id="compactChord">Am7</b>
            <span id="compactMeta">A · C · E · G</span>
          </div>

          <div class="fret-scroll">
            <div class="fretboard" id="fretboard"></div>
          </div>

          <div class="phone-fretboard" id="phoneFretboard" aria-label="手机竖向指板"></div>

          <div class="selected-strip" id="selectedStrip" aria-label="当前选择"></div>
        </section>

        <aside class="analysis" id="analysisPanel" aria-label="实时和弦分析">
          <section class="result-card" id="resultCard" aria-label="识别结果">

            <div class="chord-name" id="chordName">Am7</div>
            <button class="chord-play" id="chordPlayBtn" type="button" aria-label="播放当前和弦">

              <span class="chord-play-label" id="chordPlayLabel">播放和弦</span>
            </button>
            <div class="chord-meta" id="chordMeta"></div>
          </section>

          <section class="panel explain-card">
            <h3 id="whyTitle">为什么是 Am7</h3>
            <p class="why" id="whyCopy"></p>
          </section>

          <section class="panel interval-card">
            <h3 id="intervalTitle">每个音到根音的音程</h3>
            <div class="interval-list" id="intervalList"></div>
          </section>

          <section class="panel voicing-card" id="voicingCard">
            <div class="voicing-head">
              <h3 id="voicingTitle">同和弦其他按法</h3>
              <button class="primary" type="button" id="toggleVoicings">展开</button>
            </div>
            <div class="voicing-list" id="voicingList"></div>
          </section>
        </aside>
      </section>
    </main>
  </div>

    function normalizeLocale(language) {
      if (!language) return null;
      const normalized = language.toLowerCase();
      if (normalized.startsWith("en")) return "en";
      if (normalized.startsWith("es")) return "es";
      if (normalized.startsWith("ja")) return "ja";
      if (normalized.startsWith("zh")) return "zh-Hans";
      return null;
    }

    function storedLocale() {
      try {
        const value = localStorage.getItem(LOCALE_STORAGE_KEY);
        return SUPPORTED_LOCALES.includes(value) ? value : null;
      } catch (error) {
        return null;
      }
    }

    function saveLocale(locale) {
      try {
        localStorage.setItem(LOCALE_STORAGE_KEY, locale);
      } catch (error) {
        // Local storage can be unavailable in private or embedded browser contexts.
      }

      const queryLang = new URLSearchParams(window.location.search).get("lang");
      const candidates = [queryLang, storedLocale(), ...(navigator.languages || []), navigator.language].filter(Boolean);

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function noteName(pc) {
      return NOTE_NAMES[mod(pc, 12)];
    }

    function noteAt(stringIndex, fret) {
      return mod(OPEN_STRINGS[stringIndex].pc + fret, 12);
    }

    function midiAt(stringIndex, fret) {
      return OPEN_STRINGS[stringIndex].midi + fret;
    }

    function frequencyAt(stringIndex, fret) {
      return 440 * Math.pow(2, (midiAt(stringIndex, fret) - 69) / 12);
    }

    function writeAscii(view, offset, text) {
      for (let i = 0; i < text.length; i += 1) {
        view.setUint8(offset + i, text.charCodeAt(i));
      }
    }

    function playFallbackPluck(freq) {
      if (!window.Blob || !window.URL || typeof document.createElement !== "function") return;
      const sampleRate = 22050;
      const duration = .5;
      const sampleCount = Math.floor(sampleRate * duration);
      const buffer = new ArrayBuffer(44 + sampleCount * 2);
      const view = new DataView(buffer);

      writeAscii(view, 0, "RIFF");
      view.setUint32(4, 36 + sampleCount * 2, true);
      writeAscii(view, 8, "WAVE");
      writeAscii(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeAscii(view, 36, "data");
      view.setUint32(40, sampleCount * 2, true);

      for (let i = 0; i < sampleCount; i += 1) {
        const t = i / sampleRate;
        const decay = Math.exp(-7.2 * t);
        const body = Math.sin(2 * Math.PI * freq * t);
        const snap = .34 * Math.sin(2 * Math.PI * freq * 2.01 * t);
        const noise = (Math.random() * 2 - 1) * .035 * Math.exp(-34 * t);
        const sample = Math.max(-1, Math.min(1, (body + snap + noise) * decay * .52));
        view.setInt16(44 + i * 2, sample * 32767, true);
      }

      const url = URL.createObjectURL(new Blob([view], { type: "audio/wav" }));
      const audio = document.createElement("audio");
      audio.src = url;
      audio.volume = .38;
      const playPromise = audio.play ? audio.play() : Promise.resolve();
      playPromise.catch(() => {}).finally(() => {
        window.setTimeout(() => URL.revokeObjectURL(url), 1200);
      });
    }

    function intervalShortLabel(interval) {
      return TEXT.intervalShort[interval] || "";
    }

    function intervalFor(pc, rootPc) {
      if (rootPc === null || rootPc === undefined) return "";
      return intervalShortLabel(mod(pc - rootPc, 12));
    }

    function fretRatio(fret) {
      if (fret === 0) return .035;
      const shownScale = 1 - Math.pow(2, -1);
      const ratio = (1 - Math.pow(2, -fret / 12)) / shownScale;
      return Math.max(.04, Math.min(.96, ratio));
    }

    function triangularEnvelope(x, peak) {
      if (x <= peak) return peak <= 0 ? 0 : x / peak;
      return peak >= 1 ? 0 : (1 - x) / (1 - peak);
    }

    function horizontalWavePath(progress, peak) {
      const width = 1000;
      const mid = 27;
      const decay = Math.pow(1 - progress, 2.2);
      const phase = progress * Math.PI * 10;
      const amp = 9 * decay;
      const points = [];

      for (let i = 0; i <= 72; i += 1) {
        const xRatio = i / 72;
        const x = xRatio * width;
        const fixedEndEnvelope = Math.sin(Math.PI * xRatio);
        const pluckShape = triangularEnvelope(xRatio, peak);
        const main = pluckShape * Math.sin(phase);
        const harmonic = fixedEndEnvelope * .34 * Math.sin(phase * 1.62 + Math.PI * 6 * xRatio);
        const high = fixedEndEnvelope * .16 * Math.sin(phase * 2.2 + Math.PI * 13 * xRatio);
        const y = mid + amp * (main + harmonic + high);
        points.push(`${i === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`);
      }

      return points.join(" ");
    }

    function verticalWavePath(progress, stringIndex) {
      const height = 1000;
      const columnWidth = 100;
      const visualIndex = STRING_DISPLAY_ORDER.indexOf(stringIndex);
      const centerX = visualIndex * columnWidth + columnWidth / 2;
      const decay = Math.pow(1 - progress, 2.2);
      const phase = progress * Math.PI * 10;
      const amp = 10 * decay;
      const points = [];

      for (let i = 0; i <= 84; i += 1) {
        const yRatio = i / 84;
        const y = yRatio * height;
        const fixedEndEnvelope = Math.sin(Math.PI * yRatio);
        const main = fixedEndEnvelope * Math.sin(phase);
        const harmonic = fixedEndEnvelope * .32 * Math.sin(phase * 1.55 + Math.PI * 7 * yRatio);
        const high = fixedEndEnvelope * .13 * Math.sin(phase * 2.15 + Math.PI * 15 * yRatio);
        const x = centerX + amp * (main + harmonic + high);
        points.push(`${i === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)}`);
      }

      return points.join(" ");
    }

    function setDesktopWavePath(stringIndex, path) {
      const row = fretboard.querySelector(`.string-row[data-string="${stringIndex}"]`);
      if (!row) return;
      row.querySelectorAll(".wave-glow, .wave-core").forEach((el) => {
        el.setAttribute("d", path);
      });
    }

    function setPhoneWavePath(path) {
      phoneFretboard.querySelectorAll(".phone-wave-glow, .phone-wave-core").forEach((el) => {
        el.setAttribute("d", path);
      });
    }

    function startPhysicalStringWave(stringIndex, fret) {
      const started = performance.now();
      const duration = 860;
      const peak = fretRatio(fret);

      const frame = (now) => {
        const progress = Math.min(1, (now - started) / duration);
        setDesktopWavePath(stringIndex, horizontalWavePath(progress, peak));
        setPhoneWavePath(verticalWavePath(progress, stringIndex));
        if (progress < 1 && state.lastHitString === stringIndex) {
          requestAnimationFrame(frame);
        }
      };

      requestAnimationFrame(frame);
    }

    async function ensureAudioContext() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) {
        return null;
      }

      if (audioContext && (audioContext.state === "closed" || audioContext.state === "interrupted")) {
        audioContext = null;
      }

      audioContext = audioContext || new AudioCtor();
      if (audioContext.state !== "running") {
        try {
          await audioContext.resume();
        } catch (error) {
          audioContext = null;
          return null;
        }
      }

      return audioContext.state === "running" ? audioContext : null;
    }

    function unlockAudioFromGesture() {
      ensureAudioContext().catch(() => {
        audioContext = null;
      });
    }

    function markAudioContextStale() {
      if (audioContext && audioContext.state !== "running") {
        audioContext = null;
      }
    }

    async function playPluck(stringIndex, fret) {
      const freq = frequencyAt(stringIndex, fret);
      const context = await ensureAudioContext();
      if (!context) {
        playFallbackPluck(freq);
        return;
      }

      const now = context.currentTime + .004;
      const osc = context.createOscillator();
      const overtone = context.createOscillator();
      const gain = context.createGain();
      const filter = context.createBiquadFilter();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);
      overtone.type = "sine";
      overtone.frequency.setValueAtTime(freq * 2.01, now);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(3600, freq * 8), now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(900, freq * 3), now + .42);

      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.22, now + .012);
      gain.gain.exponentialRampToValueAtTime(.001, now + .72);

      osc.connect(filter);
      overtone.connect(filter);
      filter.connect(gain);
      gain.connect(context.destination);
      osc.start(now);
      overtone.start(now);
      osc.stop(now + .74);
      overtone.stop(now + .42);
    }

    function showPlayedString(note, token) {
      const key = `${note.stringIndex}-${note.fret}`;
      state.lastHitKey = key;
      state.lastHitString = note.stringIndex;
      update();
      startPhysicalStringWave(note.stringIndex, note.fret);

      window.setTimeout(() => {
        if (chordPlaybackToken === token && state.lastHitKey === key) {
          state.lastHitKey = null;
          state.lastHitString = null;
          update();
        }
      }, 620);
    }

    function playChord(notes) {
      const playable = notes
        .filter((note) => note.fret !== null)
        .slice()
        .sort((a, b) => a.midi - b.midi);

      if (!playable.length) return;

      const token = chordPlaybackToken + 1;
      chordPlaybackToken = token;
      const stepMs = 110;
      unlockAudioFromGesture();

      playable.forEach((note, index) => {
        window.setTimeout(() => {
          if (chordPlaybackToken !== token) return;
          playPluck(note.stringIndex, note.fret);
          showPlayedString(note, token);
        }, index * stepMs);
      });
    }

    function uniqueByPitch(notes) {
      const map = new Map();
      notes.forEach((note) => {
        if (!map.has(note.pc)) {
          map.set(note.pc, { pc: note.pc, name: note.name, positions: [] });
        }
        map.get(note.pc).positions.push(note.position);
      });
      return Array.from(map.values());
    }

    function sortByInterval(notes, rootPc) {
      if (rootPc === null || rootPc === undefined) return notes;
      return notes.slice().sort((a, b) => mod(a.pc - rootPc, 12) - mod(b.pc - rootPc, 12));
    }

    function selectedNotes() {
      return state.selected
        .map((fret, stringIndex) => {
          if (fret === null) return null;
          const pc = noteAt(stringIndex, fret);
          return {
            stringIndex,
            fret,
            pc,
            midi: midiAt(stringIndex, fret),
            name: noteName(pc),
            position: positionLabel(stringIndex, fret)
          };
        })
        .filter(Boolean);
    }

    function bassPitchClass(notes) {
      if (!notes.length) return null;
      return notes.slice().sort((a, b) => a.midi - b.midi)[0].pc;
    }

    function pitchClassCounts(notes) {
      const counts = new Map();
      notes.forEach((note) => {
        counts.set(note.pc, (counts.get(note.pc) || 0) + 1);
      });
      return counts;
    }

    function missingPenalty(interval) {
      if (interval === 7) return 4;
      if (interval === 0) return 100;
      return 16;
    }

    function extraPenalty(interval, qualitySet) {
      const hasMinorThird = qualitySet.has(3);
      const hasMajorThird = qualitySet.has(4);

      if ((interval === 3 && hasMajorThird) || (interval === 4 && hasMinorThird)) return 34;
      if ((interval === 6 || interval === 8) && qualitySet.has(7)) return 18;

      return {
        1: 18,
        2: 8,
        5: 12,
        6: 14,
        8: 14,
        9: 10,
        10: 10,
        11: 10
      }[interval] || 20;
    }

    function extraLabel(interval) {
      return {
        1: "b9",
        2: "add9",
        5: "add11",
        6: "#11",
        8: "b13",
        9: "add13",
        10: "addb7",
        11: "addmaj7"
      }[interval] || `add${interval}`;
    }

    function extensionSuffix(extra) {
      if (!extra.length) return "";
      return `(${extra.map(extraLabel).join(",")})`;
    }

    function canUseQuality(quality, selectedSet, missing, extra) {
      if (!selectedSet.has(0)) return false;
      if (!quality.defining.every((interval) => selectedSet.has(interval))) return false;
      if (missing.some((interval) => interval !== 7)) return false;
      if (extra.length > 2) return false;

      const qualitySet = new Set(quality.intervals);
      const penalty = extra.reduce((total, interval) => total + extraPenalty(interval, qualitySet), 0);
      return penalty <= 34;
    }

    function candidateConfidence(candidate) {
      const messages = [];

      if (!candidate.missing.length && !candidate.extra.length) {
        return TEXT.completeMatch;
      }

      if (candidate.missing.length) {
        messages.push(TEXT.omitted(joinList(candidate.missing.map((i) => intervalName(i)[0]))));
      }

      if (candidate.extra.length) {
        messages.push(TEXT.extensions(joinList(candidate.extra.map((i) => intervalName(i)[0]))));
      }

      return messages.join(TEXT.phraseSeparator);
    }

    function analyzeChord(notes) {
      const unique = uniqueByPitch(notes);
      const pcs = unique.map((note) => note.pc);
      const bassPc = bassPitchClass(notes);
      const pcCounts = pitchClassCounts(notes);

      if (pcs.length < 2) {
        return {
          symbol: TEXT.needMoreNotesSymbol,
          baseSymbol: TEXT.needMoreNotesSymbol,
          quality: TEXT.noChordQuality,
          rootPc: pcs[0] ?? null,
          intervals: [],
          confidence: TEXT.needAtLeastTwo
        };
      }

      const candidates = [];
      pcs.forEach((rootPc) => {
        const intervals = pcs.map((pc) => mod(pc - rootPc, 12)).sort((a, b) => a - b);
        QUALITIES.forEach((quality) => {
          const qualitySet = new Set(quality.intervals);
          const selectedSet = new Set(intervals);
          const extra = intervals.filter((interval) => !qualitySet.has(interval));
          const missing = quality.intervals.filter((interval) => !selectedSet.has(interval));
          const exact = !extra.length && !missing.length;

          if (!exact && !canUseQuality(quality, selectedSet, missing, extra)) return;

          const missingScore = missing.reduce((total, interval) => total + missingPenalty(interval), 0);
          const extraScore = extra.reduce((total, interval) => total + extraPenalty(interval, qualitySet), 0);
          const missingOnlyFifth = missing.length > 0 && missing.every((interval) => interval === 7);
          const baseScore = exact ? 100 : missingOnlyFifth && !extra.length ? 94 : !missing.length ? 92 : 84;
          const bassBonus = bassPc === rootPc ? 26 : 0;
          const repeatedRootBonus = Math.max(0, (pcCounts.get(rootPc) || 0) - 1) * 3;

          candidates.push({
            rootPc,
            quality,
            intervals,
            exact,
            missing,
            extra,
            score: baseScore + quality.priority + bassBonus + repeatedRootBonus - missingScore - extraScore
          });
        });
      });

      if (!candidates.length) {
        return {
          symbol: TEXT.unknownSymbol,
          baseSymbol: TEXT.unknownSymbol,
          quality: TEXT.noCommonChord,
          rootPc: null,
          bassPc,
          intervals: [],
          confidence: TEXT.cannotFindRoot
        };
      }

      candidates.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (Number(b.exact) !== Number(a.exact)) return Number(b.exact) - Number(a.exact);
        if (a.extra.length !== b.extra.length) return a.extra.length - b.extra.length;
        if (a.missing.length !== b.missing.length) return a.missing.length - b.missing.length;
        return b.quality.priority - a.quality.priority;
      });
      const best = candidates[0];
      const extension = extensionSuffix(best.extra);
      const baseSymbol = `${noteName(best.rootPc)}${best.quality.suffix}${extension}`;
      const slash = bassPc !== null && bassPc !== best.rootPc ? `/${noteName(bassPc)}` : "";

      return {
        symbol: `${baseSymbol}${slash}`,
        baseSymbol,
        quality: qualityName(best.quality),
        rootPc: best.rootPc,
        bassPc,
        intervals: best.intervals,
        confidence: candidateConfidence(best),
        missing: best.missing,
        extra: best.extra
      };
    }

    function createDot(name, intervalLabel) {
      const dot = document.createElement("span");
      dot.className = "dot";

      const note = document.createElement("span");
      note.className = "dot-note";
      note.textContent = name;

      const interval = document.createElement("span");
      interval.className = "dot-interval";
      interval.textContent = intervalLabel;
      dot.appendChild(interval);

      return dot;
    }

    function createMuteDot() {
      const dot = createDot("X", "");

    function createOpenDot(name, intervalLabel) {

      return dot;
    }

    function handleFretClick(stringIndex, fret) {
      chordPlaybackToken += 1;
      const key = `${stringIndex}-${fret}`;
      const nextFret = state.selected[stringIndex] === fret ? null : fret;
      state.selected[stringIndex] = nextFret;

      if (nextFret === null) {
        state.lastHitKey = null;
        state.lastHitString = null;
        update();
        return;
      }

      state.lastHitKey = key;
      state.lastHitString = stringIndex;
      playPluck(stringIndex, nextFret);
      update();
      startPhysicalStringWave(stringIndex, nextFret);
      window.setTimeout(() => {
        if (state.lastHitKey === key) {
          state.lastHitKey = null;
          state.lastHitString = null;
          update();
        }
      }, 900);
    }

    function renderFretboard(analysis) {
      fretboard.innerHTML = "";

      const numberRow = document.createElement("div");
      numberRow.className = "fret-numbers";
      const empty = document.createElement("span");
      empty.textContent = TEXT.stringFretHeader;
      numberRow.appendChild(empty);
      for (let fret = 0; fret <= 12; fret += 1) {
        const number = document.createElement("span");
        number.textContent = fretDisplay(fret);
        numberRow.appendChild(number);
      }
      fretboard.appendChild(numberRow);

      STRING_DISPLAY_ORDER.forEach((stringIndex) => {
        const translatedStringLabel = stringLabel(stringIndex);
        const row = document.createElement("div");
        row.className = "string-row";
        row.dataset.string = stringIndex;
        if (stringIndex <= 2) row.classList.add("wound");
        if (state.lastHitString === stringIndex) row.classList.add("vibrating");

        const label = document.createElement("div");
        label.className = "string-label";
        label.textContent = translatedStringLabel;
        row.appendChild(label);

        const wave = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        wave.classList.add("string-wave");
        wave.setAttribute("viewBox", "0 0 1000 54");
        wave.setAttribute("preserveAspectRatio", "none");
        const waveGlow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        waveGlow.classList.add("wave-glow");
        const waveCore = document.createElementNS("http://www.w3.org/2000/svg", "path");
        waveCore.classList.add("wave-core");
        wave.appendChild(waveGlow);
        wave.appendChild(waveCore);
        row.appendChild(wave);

        for (let fret = 0; fret <= 12; fret += 1) {
          const pc = noteAt(stringIndex, fret);
          const selected = state.selected[stringIndex] === fret;
          const mutedOpen = fret === 0 && state.selected[stringIndex] === null;
          const openSelected = selected && fret === 0;
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "string-cell";
          cell.dataset.string = stringIndex;
          cell.dataset.fret = fret;
          cell.setAttribute(
            "aria-label",
            mutedOpen
              ? TEXT.ariaMuted(translatedStringLabel)
              : openSelected
                ? TEXT.ariaOpen(translatedStringLabel, noteName(pc))
                : TEXT.ariaFret(translatedStringLabel, fret, noteName(pc))
          );
          if (mutedOpen) cell.classList.add("muted-open");
          if (selected) cell.classList.add("selected");
          if (openSelected) cell.classList.add("open-selected");
          if (selected && pc === analysis.rootPc) cell.classList.add("root");
          if (state.lastHitString === stringIndex) cell.classList.add("vibrating");
          if (state.lastHitKey === `${stringIndex}-${fret}`) cell.classList.add("hit");

          cell.appendChild(mutedOpen ? createMuteDot() : openSelected ? createOpenDot(noteName(pc), intervalFor(pc, analysis.rootPc)) : createDot(noteName(pc), selected ? intervalFor(pc, analysis.rootPc) : ""));

          cell.addEventListener("click", () => {
            handleFretClick(stringIndex, fret);
          });

          row.appendChild(cell);
        }

        fretboard.appendChild(row);
      });
    }

    function renderPhoneFretboard(analysis) {
      phoneFretboard.innerHTML = "";
      phoneFretboard.classList.toggle("vibrating", state.lastHitString !== null);
      phoneFretboard.classList.toggle("wave-wound", state.lastHitString !== null && state.lastHitString <= 2);

      const head = document.createElement("div");
      head.className = "phone-head";
      const corner = document.createElement("span");
      corner.textContent = TEXT.phoneFretStringHeader || TEXT.fretStringHeader;
      head.appendChild(corner);
      STRING_DISPLAY_ORDER.forEach((stringIndex) => {
        const label = document.createElement("span");
        label.textContent = phoneStringLabel(stringIndex);
        head.appendChild(label);
      });
      phoneFretboard.appendChild(head);

      for (let fret = 0; fret <= 12; fret += 1) {
        const row = document.createElement("div");
        row.className = "phone-fret-row";
        row.dataset.fret = fret;
        row.style.minHeight = `${FRET_ROW_HEIGHTS[fret]}px`;

        const label = document.createElement("div");
        label.className = "phone-fret-label";
        label.textContent = fretDisplay(fret);
        row.appendChild(label);

        STRING_DISPLAY_ORDER.forEach((stringIndex) => {
          const translatedStringLabel = stringLabel(stringIndex);
          const pc = noteAt(stringIndex, fret);
          const selected = state.selected[stringIndex] === fret;
          const mutedOpen = fret === 0 && state.selected[stringIndex] === null;
          const openSelected = selected && fret === 0;
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "phone-cell";
          cell.dataset.string = stringIndex;
          cell.dataset.fret = fret;
          cell.setAttribute(
            "aria-label",
            mutedOpen
              ? TEXT.ariaMuted(translatedStringLabel)
              : openSelected
                ? TEXT.ariaOpen(translatedStringLabel, noteName(pc))
                : TEXT.ariaFret(translatedStringLabel, fret, noteName(pc))
          );
          if (mutedOpen) cell.classList.add("muted-open");
          if (selected) cell.classList.add("selected");
          if (openSelected) cell.classList.add("open-selected");
          if (selected && pc === analysis.rootPc) cell.classList.add("root");
          if (state.lastHitString === stringIndex) cell.classList.add("vibrating");
          if (state.lastHitKey === `${stringIndex}-${fret}`) cell.classList.add("hit");

          cell.appendChild(mutedOpen ? createMuteDot() : openSelected ? createOpenDot(noteName(pc), intervalFor(pc, analysis.rootPc)) : createDot(noteName(pc), selected ? intervalFor(pc, analysis.rootPc) : ""));
          cell.addEventListener("click", () => {
            handleFretClick(stringIndex, fret);
          });
          row.appendChild(cell);
        });

        phoneFretboard.appendChild(row);
      }

      const wave = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      wave.classList.add("phone-string-wave");
      wave.setAttribute("viewBox", "0 0 600 1000");
      wave.setAttribute("preserveAspectRatio", "none");
      const waveGlow = document.createElementNS("http://www.w3.org/2000/svg", "path");
      waveGlow.classList.add("phone-wave-glow");
      const waveCore = document.createElementNS("http://www.w3.org/2000/svg", "path");
      waveCore.classList.add("phone-wave-core");
      wave.appendChild(waveGlow);
      wave.appendChild(waveCore);
      phoneFretboard.appendChild(wave);
    }

    function renderSelected(notes, analysis) {
      selectedStrip.innerHTML = "";
      selectionCount.textContent = TEXT.selectedCount(notes.length);

      if (!notes.length) {
        const empty = document.createElement("span");
        empty.className = "selected-note";
        empty.textContent = TEXT.noNotes;
        selectedStrip.appendChild(empty);
        return;
      }

      notes.forEach((note) => {
        const interval = analysis.rootPc === null || analysis.rootPc === undefined
          ? ""
          : intervalName(mod(note.pc - analysis.rootPc, 12))[0];
        const item = document.createElement("span");
        item.className = "selected-note";
        item.innerHTML = `${note.position} · ${note.name}${interval ? ` · <b>${interval}</b>` : ""}`;
        selectedStrip.appendChild(item);
      });
    }

    function renderResult(notes, analysis) {
      const unique = sortByInterval(uniqueByPitch(notes), analysis.rootPc);
      chordName.textContent = analysis.symbol;
      chordName.classList.toggle("long-result", analysis.symbol.length > 4 || analysis.symbol.includes(" "));
      compactChord.textContent = analysis.symbol;
      resultState.textContent = notes.length ? TEXT.resultLive : TEXT.resultWaiting;
      chordMeta.innerHTML = "";
      compactMeta.textContent = unique.map((note) => note.name).join(" · ") || TEXT.noNotesShort;
      const canPlayChord = unique.length > 1 && analysis.rootPc !== null;
      chordPlayBtn.hidden = !canPlayChord;
      chordPlayBtn.disabled = !canPlayChord;
      chordPlayBtn.setAttribute("aria-label", canPlayChord ? TEXT.playChordAria(analysis.symbol) : TEXT.noPlayableChord);

      [
        analysis.quality,
        analysis.confidence,
        unique.map((note) => note.name).join(" · ") || TEXT.noNotesShort
      ].forEach((text) => {
        const span = document.createElement("span");
        span.textContent = text;
        chordMeta.appendChild(span);
      });

      whyTitle.textContent = TEXT.whyTitle(analysis.symbol);

      if (!notes.length) {
        whyCopy.textContent = TEXT.whyNoNotes;
        return;
      }

      if (unique.length < 2) {
        whyCopy.textContent = TEXT.whyOneNote;
        return;
      }

      if (analysis.rootPc === null) {
        whyCopy.textContent = TEXT.whyUnknown;
        return;
      }

      const intervalText = unique
        .map((note) => {
          const interval = mod(note.pc - analysis.rootPc, 12);
          return TEXT.noteIsInterval(note.name, intervalName(interval)[0]);
        })
        .join(TEXT.phraseSeparator);

      const bassText = analysis.bassPc !== null && analysis.bassPc !== analysis.rootPc
        ? TEXT.bassCopy(noteName(analysis.bassPc), analysis.symbol)
        : "";

      whyCopy.textContent = TEXT.whyCopy({
        notes: joinList(unique.map((note) => note.name)),
        root: noteName(analysis.rootPc),
        intervals: intervalText,
        quality: analysis.quality,
        bass: bassText
      });
    }

    function renderIntervals(notes, analysis) {
      const unique = uniqueByPitch(notes);
      intervalList.innerHTML = "";

      if (!unique.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = TEXT.intervalEmpty;
        intervalList.appendChild(empty);
        return;
      }

      if (analysis.rootPc === null) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = TEXT.intervalNoRoot;
        intervalList.appendChild(empty);
        return;
      }

      unique
        .sort((a, b) => mod(a.pc - analysis.rootPc, 12) - mod(b.pc - analysis.rootPc, 12))
        .forEach((note) => {
          const interval = mod(note.pc - analysis.rootPc, 12);
          const [name, role] = intervalName(interval);
          const row = document.createElement("div");
          row.className = "interval-row";
          if (interval === 0) row.classList.add("root-note");

          row.innerHTML = `
            <span class="note-token">${note.name}</span>
            <span class="interval-copy">
              <b>${name}</b>
              <span>${joinList(note.positions)}</span>
            </span>
            <span class="interval-badge">${role}</span>
          `;
          intervalList.appendChild(row);
        });
    }

    function svgElement(tag, attrs = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => {
        element.setAttribute(key, value);
      });
      return element;
    }

    function createChordDiagram(frets, rootPc) {
      const svg = svgElement("svg", {
        class: "chord-chart",
        viewBox: "0 0 170 142",
        role: "img",
        "aria-label": frets.map((fret, stringIndex) => {
          const stringNumber = 6 - stringIndex;
          return fret === null ? TEXT.diagramMuted(stringNumber) : TEXT.diagramFret(stringNumber, fret);
        }).join(TEXT.phraseSeparator)
      });

      const xStart = 34;
      const yTop = 32;
      const stringGap = 20;
      const fretGap = 22;
      const positiveFrets = frets.filter((fret) => fret !== null && fret > 0);
      const maxFret = positiveFrets.length ? Math.max(...positiveFrets) : 0;
      const minFret = positiveFrets.length ? Math.min(...positiveFrets) : 1;
      const baseFret = maxFret > 4 ? (maxFret - minFret > 3 ? Math.max(1, maxFret - 3) : minFret) : 1;
      const diagramFrets = 4;

      for (let fretLine = 0; fretLine <= diagramFrets; fretLine += 1) {
        const y = yTop + fretLine * fretGap;
        svg.appendChild(svgElement("line", {
          class: fretLine === 0 && baseFret === 1 ? "chart-nut" : "chart-fret",
          x1: xStart,
          y1: y,
          x2: xStart + 5 * stringGap,
          y2: y
        }));
      }

      for (let stringIndex = 0; stringIndex < 6; stringIndex += 1) {
        const x = xStart + stringIndex * stringGap;
        svg.appendChild(svgElement("line", {
          class: "chart-string",
          x1: x,
          y1: yTop,
          x2: x,
          y2: yTop + diagramFrets * fretGap
        }));

        const label = svgElement("text", {
          class: "chart-string-label",
          x,
          y: yTop + diagramFrets * fretGap + 15,
          "text-anchor": "middle"
        });
        label.textContent = `${6 - stringIndex}`;
        svg.appendChild(label);
      }

      if (baseFret > 1) {
        const base = svgElement("text", {
          class: "chart-base-fret",
          x: 5,
          y: yTop + fretGap * .64
        });
        base.textContent = `${baseFret}fr`;
        svg.appendChild(base);
      }

      frets.forEach((fret, stringIndex) => {
        const x = xStart + stringIndex * stringGap;
        const pc = fret === null ? null : noteAt(stringIndex, fret);
        const isRoot = pc !== null && pc === rootPc;

        if (fret === null) {
          const muted = svgElement("text", {
            class: "chart-muted",
            x,
            y: 17
          });
          muted.textContent = "X";
          svg.appendChild(muted);
          return;
        }

        if (fret === 0) {
          svg.appendChild(svgElement("circle", {
            class: `chart-open${isRoot ? " root" : ""}`,
            cx: x,
            cy: 17,
            r: 6
          }));
          const openLabel = svgElement("text", {
            class: `chart-open-label${isRoot ? " root" : ""}`,
            x,
            y: 17
          });
          openLabel.textContent = "0";
          svg.appendChild(openLabel);
          return;
        }

        const row = Math.max(0, Math.min(diagramFrets - 1, fret - baseFret));
        const y = yTop + row * fretGap + fretGap / 2;
        svg.appendChild(svgElement("circle", {
          class: `chart-dot${isRoot ? " root" : ""}`,
          cx: x,
          cy: y,
          r: 8.5
        }));

        const note = svgElement("text", {
          class: "chart-note",
          x,
          y
        });
        note.textContent = noteName(pc);
        svg.appendChild(note);
      });

      return svg;
    }

    function renderVoicings(analysis) {
      const voicingKey = analysis.baseSymbol || analysis.symbol;
      const options = VOICINGS[voicingKey] || [];
      voicingTitle.textContent = TEXT.voicingTitle(voicingKey);
      voicingCard.classList.toggle("open", state.voicingsOpen);
      toggleVoicings.textContent = state.voicingsOpen ? TEXT.collapse : TEXT.expand;
      voicingList.innerHTML = "";

      if (!options.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = TEXT.voicingEmpty;
        voicingList.appendChild(empty);
        return;
      }

      options.forEach((option) => {
        const item = document.createElement("div");
        item.className = "voicing-option";
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");

        const copy = document.createElement("div");
        copy.className = "voicing-copy";
        const title = document.createElement("h4");
        title.textContent = localizedCopy(option.name);
        const hint = document.createElement("p");
        hint.textContent = localizedCopy(option.hint);
        copy.appendChild(title);
        copy.appendChild(hint);

        const chart = createChordDiagram(option.frets, analysis.rootPc);

        item.appendChild(copy);
        item.appendChild(chart);
        item.addEventListener("click", () => {
          state.selected = option.frets.slice();
          update();
        });
        item.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          state.selected = option.frets.slice();
          update();
        });
        voicingList.appendChild(item);
      });
    }

    function update() {
      const notes = selectedNotes();
      const analysis = analyzeChord(notes);
      renderFretboard(analysis);
      renderPhoneFretboard(analysis);
      renderSelected(notes, analysis);
      renderResult(notes, analysis);
      renderIntervals(notes, analysis);
      renderVoicings(analysis);
    }

    document.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button, select, .phone-cell, .string-cell, .voicing-option")) {
        unlockAudioFromGesture();
      }
    }, { passive: true, capture: true });

    document.addEventListener("touchstart", (event) => {
      if (event.target.closest("button, select, .phone-cell, .string-cell, .voicing-option")) {
        unlockAudioFromGesture();
      }
    }, { passive: true, capture: true });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        markAudioContextStale();
      }
    });

    window.addEventListener("pageshow", markAudioContextStale);
    window.addEventListener("focus", markAudioContextStale);

    let lastTouchEnd = 0;
    document.addEventListener("touchend", (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 320) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener("gesturestart", (event) => {
      event.preventDefault();
    });

    document.getElementById("demoBtn").addEventListener("click", () => {
      chordPlaybackToken += 1;
      state.selected = [null, 0, 2, 0, 1, 0];
      update();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      chordPlaybackToken += 1;
      state.selected = [null, null, null, null, null, null];
      update();
    });

    toggleVoicings.addEventListener("click", () => {
      state.voicingsOpen = !state.voicingsOpen;
      update();
    });

    chordPlayBtn.addEventListener("click", () => {
      playChord(selectedNotes());
    });

    languageSelect.addEventListener("change", (event) => {
      setLocale(event.target.value);
    });

    applyStaticCopy();
    update();
  </script>
</body>
</html>
